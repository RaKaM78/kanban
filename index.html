<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{ --bg:#eef1f5; --ink:#2b2b2b; --muted:#6b7280; --col-bg:#dfe3ea; --col-header:#c9ced8; --accent:#4f7cff; --shadow:0 3px 8px rgba(0,0,0,.18); }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}

/* Barre du haut + onglets */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #d7dae0;}
#toolbar h1{font-size:15px;margin:0;color:#333;font-weight:600;}
#tabBar{display:flex;gap:4px;margin-right:auto;flex-wrap:wrap;}
.tab-btn{border:none;background:none;padding:6px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;color:#555;font-weight:500;}
.tab-btn.active{background:var(--accent);color:#fff;}
#syncIndicator{font-size:11px;color:#888;}
#syncIndicator.hidden{display:none;}

.btn{border:none;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:500;white-space:nowrap;}
.btn.secondary{background:#eceff3;color:#333;}
.btn.danger{background:#fff;color:#c0392b;border:1px solid #f0c4c0;}
.btn.danger:hover{background:#fdf1f0;}
.btn.active{background:#33508f;color:#fff;}
.btn:active{transform:translateY(1px);}

.sub-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 12px;background:#fff;border-bottom:1px solid #d7dae0;}
.sub-toolbar input[type=search],.sub-toolbar select{font-size:12.5px;padding:5px 8px;border:1px solid #d7dae0;border-radius:7px;background:#fff;color:#000000;}
.sub-toolbar input[type=search]{flex:1;min-width:110px;}

.view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* Kanban */
#board{flex:1;display:flex;align-items:flex-start;gap:12px;padding:14px;overflow:auto;height:100%;}
#board.stacked{flex-direction:column;overflow-x:hidden;}
#board.stacked .lane{flex:none;width:100%;max-height:none;}
#board.stacked .lane.collapsed{width:100%;flex:none;height:auto;}
#board.stacked .lane.collapsed .lane-header{flex-direction:row;height:auto;}
#board.stacked .lane.collapsed .lane-title{writing-mode:horizontal-tb;transform:none;margin:0;}
#board.stacked .lane-body{max-height:44vh;}
.lane{background:var(--col-bg);border-radius:12px;display:flex;flex-direction:column;flex:0 0 280px;max-height:100%;transition:flex-basis .15s;}
.lane.collapsed{flex:0 0 46px;width:46px;overflow:hidden;}
.lane-header{display:flex;align-items:center;gap:6px;padding:10px;background:var(--col-header);border-radius:12px 12px 0 0;cursor:pointer;user-select:none;}
.lane.collapsed .lane-header{flex-direction:column;border-radius:12px;height:100%;padding:10px 6px;}
.lane-color-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.lane-title{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lane.collapsed .lane-title{writing-mode:vertical-rl;transform:rotate(180deg);flex:1;margin:6px 0;}
.lane-count{background:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700;color:#444;}
.lane-collapse-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#555;padding:2px 4px;}
.lane-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;min-height:40px;}
.lane-body.drag-over{background:rgba(79,124,255,.12);}
.lane-add-card{margin:0 8px 10px;border:1px dashed #b7bcc6;background:none;border-radius:8px;padding:6px;font-size:12px;color:#666;cursor:pointer;}
.card{border-radius:4px;padding:10px 10px 8px;cursor:grab;box-shadow:var(--shadow);font-size:12.5px;position:relative;font-family:'Segoe Print','Bradley Hand',cursive,'Segoe UI',sans-serif;}
.card.dragging{opacity:.4;}
.card::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(-3deg);width:34px;height:14px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.05);}
.card-desc{font-weight:600;font-size:13.5px;min-height:18px;outline:none;word-break:break-word;margin-bottom:6px;}
.card-desc:focus{background:rgba(255,255,255,.5);border-radius:4px;}
.card-meta-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px;}
.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;}
.chip{background:rgba(255,255,255,.6);border-radius:999px;padding:1px 6px;font-size:10.5px;color:#333;text-decoration:none;}
.card input[type=date]{font-family:inherit;font-size:11px;border:none;background:rgba(255,255,255,.55);border-radius:5px;padding:2px 3px;cursor:pointer;color:#222;}
.deadline-row{display:flex;align-items:center;gap:4px;font-size:11px;color:#3a3a3a;}
.deadline-row.overdue{color:#b3261e;font-weight:700;}
.card-ref{font-size:10px;color:#555;margin-top:2px;}

/* Modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.overlay.hidden{display:none;}
.modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.modal h2{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
.field textarea,.field input,.field select{width:100%;padding:7px 8px;border:1px solid #d7dae0;border-radius:7px;font-size:13px;font-family:inherit;}
.field textarea{min-height:60px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-footer{display:flex;justify-content:space-between;margin-top:16px;gap:8px;}
.meta-readonly{font-size:11px;color:var(--muted);margin-top:10px;border-top:1px solid #eee;padding-top:8px;white-space:pre-line;}
.meta-readonly.scroll{max-height:80px;overflow-y:auto;}
.checklist-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.checklist-item input[type=text]{flex:1;padding:5px 6px;font-size:12.5px;border:1px solid #ddd;border-radius:6px;}
.lane-config-row{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;flex-wrap:wrap;}
.lane-config-row input[type=text]{flex:1;min-width:70px;padding:5px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;}
.lane-config-row input[type=color]{width:30px;height:26px;border:none;padding:0;background:none;}
.lane-config-row select{font-size:11px;padding:3px 4px;border:1px solid #ddd;border-radius:6px;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;color:#666;padding:2px 5px;}
.warning-banner{background:#fff4e5;color:#8a5a00;border:1px solid #f3d19e;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99;}
.hidden{display:none !important;}

/* Calendrier */
#calLabel{font-weight:600;font-size:14px;min-width:130px;text-align:center;}
#calendarGrid{flex:1;overflow-y:auto;padding:10px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{background:#fff;border-radius:8px;min-height:74px;padding:4px;font-size:11px;}
.cal-day.muted{background:transparent;color:#bbb;}
.cal-day.today{outline:2px solid var(--accent);}
.cal-daynum{font-weight:600;font-size:11px;}
.cal-day-tasks{display:flex;flex-direction:column;gap:2px;margin-top:3px;}
.cal-task{color:#fff;border-radius:4px;padding:1px 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-more{font-size:10px;color:var(--muted);}

/* Whiteboard */
.wb-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.wb-swatch.active{border-color:#333;}
.wb-tool.active{background:#dbe3f5;border-radius:8px;}
#wbCanvasWrap{flex:1;position:relative;background:#fff;overflow:hidden;}
#wbCanvas{position:absolute;inset:0;touch-action:none;}
#wbOverlay{position:absolute;inset:0;pointer-events:none;}
.wb-el{position:absolute;box-sizing:border-box;pointer-events:auto;}
.wb-el.selected{outline:2px dashed #4f7cff;outline-offset:2px;}
.wb-shape-inner{width:100%;height:100%;box-sizing:border-box;background:transparent;pointer-events:none;}
.wb-el[data-type="text"],.wb-el[data-type="sticky"]{display:flex;flex-direction:column;}
.wb-draghandle{height:12px;flex:none;background:rgba(0,0,0,.08);border-radius:4px 4px 0 0;cursor:move;font-size:9px;text-align:center;line-height:12px;color:#777;user-select:none;}
.wb-content{flex:1;min-height:0;width:100%;box-sizing:border-box;outline:none;overflow:auto;font-size:13px;padding:4px;cursor:text;background:transparent;}
.wb-sticky-content{padding:8px;box-shadow:0 3px 8px rgba(0,0,0,.18);border-radius:0 0 4px 4px;font-family:'Segoe Print','Bradley Hand',cursive,'Segoe UI',sans-serif;}
.wb-del,.wb-resize{position:absolute;display:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:11px;cursor:pointer;z-index:5;}
.wb-el.selected .wb-del,.wb-el.selected .wb-resize{display:flex;}
.wb-del{top:-9px;right:-9px;color:#c0392b;}
.wb-resize{bottom:-9px;right:-9px;cursor:nwse-resize;color:#555;}
.wb-resize::after{content:'⤡';}

/* Tableau de bord */
#dashboardGrid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-content:start;}
.dash-module{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.dash-module h3{margin:0 0 10px;font-size:13px;color:#444;}
.dash-module.full{grid-column:1/-1;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;}
.kpi-card{background:#f7f8fa;border-radius:10px;padding:10px;text-align:center;}
.kpi-value{font-size:22px;font-weight:800;}
.kpi-label{font-size:10.5px;color:var(--muted);margin-top:2px;}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.donut-legend{font-size:11.5px;display:flex;flex-direction:column;gap:4px;}
.donut-legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
.bar-row{margin-bottom:6px;}
.bar-track{background:#eee;border-radius:6px;overflow:hidden;height:10px;}
.bar-fill{height:100%;}
.dash-config-row{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>🗂️ Kanban</h1>
    <div id="tabBar">
      <button class="tab-btn" data-tab="dashboard">📊 Tableau de bord</button>
      <button class="tab-btn active" data-tab="kanban">🗂️ Kanban</button>
      <button class="tab-btn" data-tab="calendar">📅 Calendrier</button>
      <button class="tab-btn" data-tab="whiteboard">🖌️ Whiteboard</button>
    </div>
    <span id="syncIndicator" class="hidden">⏳ Sync…</span>
  </div>

  <!-- Onglet Kanban -->
  <!-- Onglet Tableau de bord -->
  <div id="view-dashboard" class="view hidden">
    <div class="sub-toolbar">
      <button class="btn secondary" id="btnDashExport">⬇️ Export CSV</button>
      <button class="btn secondary" id="btnDashConfig">⚙️ Personnaliser</button>
    </div>
    <div id="dashboardGrid"></div>
  </div>

  <div id="view-kanban" class="view">
    <div class="sub-toolbar">
      <input type="search" id="fSearch" placeholder="🔍 Rechercher…">
      <select id="fAssignee"><option value="">Assigné à : tous</option></select>
      <select id="fPriorite"><option value="">Priorité : toutes</option></select>
      <select id="fType"><option value="">Type : tous</option></select>
      <button class="btn secondary" id="btnToggleView" title="Basculer vue colonnes / liste">📱</button>
      <button class="btn secondary" id="btnExportCsv">⬇️ Export CSV</button>
      <button class="btn secondary" id="btnSettings">⚙️ Colonnes</button>
      <button class="btn" id="btnNewCard">+ Nouvelle tâche</button>
    </div>
    <div id="board"></div>
  </div>

  <!-- Onglet Calendrier -->
  <div id="view-calendar" class="view hidden">
    <div class="sub-toolbar">
      <button class="icon-btn" id="calPrev">◀</button>
      <span id="calLabel"></span>
      <button class="icon-btn" id="calNext">▶</button>
      <button class="btn secondary" id="calToday">Aujourd'hui</button>
    </div>
    <div id="calendarGrid"></div>
  </div>

  <!-- Onglet Whiteboard -->
  <div id="view-whiteboard" class="view hidden">
    <div class="sub-toolbar" id="wbToolbar">
      <button class="icon-btn wb-tool active" data-wb-tool="pen" title="Stylo">✏️</button>
      <button class="icon-btn wb-tool" data-wb-tool="eraser" title="Gomme">🧹</button>
      <button class="icon-btn wb-tool" data-wb-tool="rect" title="Rectangle">⬜</button>
      <button class="icon-btn wb-tool" data-wb-tool="ellipse" title="Ellipse">⚪</button>
      <button class="icon-btn wb-tool" data-wb-tool="text" title="Texte">🔤</button>
      <button class="icon-btn wb-tool" data-wb-tool="sticky" title="Post-it">🗒️</button>
      <button class="icon-btn wb-tool" data-wb-tool="select" title="Sélectionner / déplacer">🖱️</button>
      <span style="width:1px;height:20px;background:#ddd;"></span>
      <button class="wb-swatch active" data-wb-color="#222222" style="background:#222222" title="Noir"></button>
      <button class="wb-swatch" data-wb-color="#e63946" style="background:#e63946" title="Rouge"></button>
      <button class="wb-swatch" data-wb-color="#2a9d8f" style="background:#2a9d8f" title="Vert"></button>
      <button class="wb-swatch" data-wb-color="#4f7cff" style="background:#4f7cff" title="Bleu"></button>
      <button class="wb-swatch" data-wb-color="#f4a300" style="background:#f4a300" title="Orange"></button>
      <label style="font-size:11.5px;display:flex;align-items:center;gap:4px;">Épaisseur <input type="range" id="wbSize" min="1" max="24" value="3"></label>
      <button class="btn secondary" id="wbClear">🗑️ Tout effacer</button>
    </div>
    <div id="wbCanvasWrap"><canvas id="wbCanvas"></canvas><div id="wbOverlay"></div></div>
  </div>
</div>

<div class="overlay hidden" id="taskOverlay"><div class="modal" id="taskModal"></div></div>
<div class="overlay hidden" id="settingsOverlay"><div class="modal" id="settingsModal"></div></div>
<div class="overlay hidden" id="dashConfigOverlay"><div class="modal" id="dashConfigModal"></div></div>
<canvas id="confetti-canvas"></canvas>

<script>
/* ===== CONFIG (données statiques) ===== */
const REQUIRED_COLUMNS = [
  { name:"Description", type:"Text" },
  { name:"Priorite", title:"Priorité", type:"Choice" },
  { name:"Deadline", type:"DateTime", optional:true },
  { name:"Statut", type:"Choice" },
  { name:"AssigneA", title:"Assigné à", type:"ChoiceList", optional:true },
  { name:"RefProjet", title:"Référence du Projet", type:"Text", optional:true },
  { name:"Type", type:"Choice", optional:true },
  { name:"Notes", type:"Text", optional:true },
  { name:"Responsable", type:"ChoiceList", optional:true },
  { name:"CreePar", title:"Créé par", type:"ChoiceList", optional:true },
  { name:"CreeLe", title:"Créé le", type:"DateTime", optional:true },
  { name:"DerniereMaj", title:"Dernière mise à jour", type:"DateTime", optional:true },
  { name:"Historique", title:"Historique des changements", type:"Text", optional:true },
  { name:"Ordre", title:"Ordre (tri manuel)", type:"Numeric", optional:true },
  { name:"Checklist", title:"Sous-tâches (JSON)", type:"Text", optional:true },
];
const PRIORITY_COLORS = {
  Urgent:{bg:"#ffd3d3",badge:"#c0392b"}, Haute:{bg:"#ffe3bd",badge:"#d9822b"},
  Moyenne:{bg:"#fff6b8",badge:"#c9a400"}, Basse:{bg:"#d9f5d6",badge:"#3a9d4c"},
  __default:{bg:"#f3f0e6",badge:"#8a8a8a"},
};
// Effets déclenchables quand une tâche arrive dans une colonne. "confetti" a un rendu
// dédié (canvas) ; "custom" utilise un émoji libre (lane.customEmoji) ; les autres sont
// des émojis prédéfinis animés (voir launchEmojiBurst).
const EFFECTS = {
  none:     { label: "Aucun" },
  confetti: { label: "🎉 Confettis" },
  clap:     { label: "👏🏾 Applaudissements", emoji: "👏🏾" },
  boom:     { label: "💥 Boom", emoji: "💥" },
  sparkles: { label: "✨ Étincelles", emoji: "✨" },
  party:    { label: "🥳 Fête", emoji: "🥳" },
  fire:     { label: "🔥 Feu", emoji: "🔥" },
  rocket:   { label: "🚀 Fusée", emoji: "🚀" },
  custom:   { label: "🖊️ Personnalisé…" },
};
const cid = () => "c" + Math.random().toString(36).slice(2, 9);
const defaultColumnsConfig = () => [
  { id:cid(), label:"À faire",    statut:"À faire",    color:"#8a8f98", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"todo" },
  { id:cid(), label:"En cours",   statut:"En cours",   color:"#4f7cff", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"doing" },
  { id:cid(), label:"En attente", statut:"En attente", color:"#d9822b", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"todo" },
  { id:cid(), label:"Terminé",    statut:"Terminé",    color:"#3a9d4c", sortByDeadline:false, effect:"confetti", collapsedByDefault:false, dashCategory:"done" },
  { id:cid(), label:"Annulé",     statut:"Annulé",     color:"#b3261e", sortByDeadline:false, effect:"none",     collapsedByDefault:true,  dashCategory:"cancelled" },
];
// Compatibilité avec les configs déjà enregistrées (ancien champ booléen `confetti`, absence de `dashCategory`)
const normalizeColumnsConfig = cfg => cfg.map(l => ({
  ...l,
  effect: l.effect ?? (l.confetti ? "confetti" : "none"),
  dashCategory: l.dashCategory ?? "todo",
}));
const DASHBOARD_MODULES = {
  kpis:         { label: "Indicateurs clés" },
  donutStatut:  { label: "Répartition par statut" },
  barsPriorite: { label: "Répartition par priorité" },
  teamLoad:     { label: "Charge de l'équipe" },
  deadlines:    { label: "Échéances", full:true },
};
const defaultDashboardLayout = () => Object.keys(DASHBOARD_MODULES).map(id => ({ id, visible:true }));

/* ===== DOMAINE (logique pure, aucune dépendance DOM/Grist) ===== */
const gristDateToJS = v => v == null || v === "" ? null : (typeof v === "number" ? new Date(v*1000) : (isNaN(new Date(v)) ? null : new Date(v)));
const jsDateToGristEpoch = s => s ? Math.floor(new Date(s+"T00:00:00Z").getTime()/1000) : null;
const nowEpoch = () => Math.floor(Date.now()/1000);
const fmtDate = d => d ? d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
const fmtDateTime = d => d ? d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const toDateInputValue = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : "";
const decodeChoiceList = v => Array.isArray(v) ? (v[0]==="L" ? v.slice(1) : v) : (typeof v==="string" && v ? v.split(",").map(s=>s.trim()).filter(Boolean) : []);
const encodeChoiceList = arr => ["L", ...arr];
const priorityStyle = p => PRIORITY_COLORS[p] || PRIORITY_COLORS.__default;
const seededRotation = id => {
  const n = typeof id==="number" ? id : String(id).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  return ((n % 9) - 4) * 0.8;
};
const parseChecklist = raw => { try{ const a = JSON.parse(raw||"[]"); return Array.isArray(a) ? a : []; }catch{ return []; } };
const checklistProgress = raw => { const items = parseChecklist(raw); return items.length ? { done: items.filter(i=>i.done).length, total: items.length } : null; };
// Règle métier : tri par deadline sur les colonnes actives ; sur les colonnes non
// triées par deadline, on respecte l'ordre manuel (glisser-déposer) dès qu'il existe,
// sinon on retombe sur un tri par dernière mise à jour décroissante.
function tasksForLane(records, lane){
  const list = records.filter(r => (r.Statut||"") === lane.statut);
  if (lane.sortByDeadline){
    list.sort((a,b) => (gristDateToJS(a.Deadline) ?? Infinity) - (gristDateToJS(b.Deadline) ?? Infinity));
  } else if (list.some(r => r.Ordre != null)){
    list.sort((a,b) => (a.Ordre ?? Infinity) - (b.Ordre ?? Infinity));
  } else {
    list.sort((a,b) => (gristDateToJS(b.DerniereMaj)||0) - (gristDateToJS(a.DerniereMaj)||0));
  }
  return list;
}
const defaultTaskFields = statut => ({ Description:"Nouvelle tâche", Priorite:"Moyenne", Statut:statut, CreeLe:nowEpoch(), DerniereMaj:nowEpoch() });

/* ===== INFRASTRUCTURE (seules fonctions qui touchent `grist`/`localStorage`) ===== */
let gristAvailable = true;
let colMappings = null; // { NomLogique: "vrai_id_colonne_grist", ... }

function initGrist({ onRecordsChange, onOptionsChange, onUnavailable }){
  try{
    grist.ready({ columns: REQUIRED_COLUMNS, allowSelectBy: true, requiredAccess: "full" });
    grist.onRecords((records, mappings) => {
      colMappings = mappings;
      onRecordsChange(records.map(r => ({ ...grist.mapColumnNames(r, mappings), id: r.id })));
    });
    grist.onOptions(options => onOptionsChange(options || {}));
  }catch(e){
    gristAvailable = false;
    console.warn("Grist indisponible, mode démo local.", e);
    onUnavailable?.(e);
  }
}
// Traduit { NomLogique: valeur } -> { vrai_id_colonne: valeur } grâce aux mappings
// fournis par Grist (nos noms "Description", "CreeLe", etc. ne sont pas forcément
// les vrais identifiants de colonnes de la table de l'utilisateur). Une colonne
// optionnelle non mappée par l'utilisateur est simplement omise (au lieu d'envoyer
// un identifiant invalide, qui provoquerait une erreur côté Grist).
function toRealFields(fields){
  if (!colMappings) return fields;
  const out = {};
  for (const [key, value] of Object.entries(fields)){
    const realKey = colMappings[key];
    if (realKey) out[realKey] = value;
  }
  return out;
}
async function updateTaskFields(rowId, fields){
  const payload = { ...fields, DerniereMaj: nowEpoch() };
  if (!gristAvailable) throw new Error("Grist indisponible");
  await grist.selectedTable.update({ id: rowId, fields: toRealFields(payload) });
}
async function createTask(fields){
  if (!gristAvailable) throw new Error("Grist indisponible");
  return grist.selectedTable.create({ fields: toRealFields(fields) });
}
async function deleteTask(rowId){
  if (!gristAvailable) throw new Error("Grist indisponible");
  await grist.selectedTable.destroy(rowId);
}

/* ===== ÉTAT (store observable) ===== */
const state = {
  records:[], columnsConfig:null, dashboardLayout:null, collapsed:new Set(), editingId:null,
  filters:{ search:"", assignee:"", priorite:"", type:"" },
};
const listeners = [];
const subscribe = fn => listeners.push(fn);
const notify = () => listeners.forEach(fn => fn());
function setRecords(records){ state.records = records; notify(); }
function setColumnsConfig(cfg){
  state.columnsConfig = normalizeColumnsConfig(cfg);
  state.columnsConfig.forEach(c => c.collapsedByDefault && state.collapsed.add(c.id));
  notify();
}
function setDashboardLayout(cfg){ state.dashboardLayout = cfg; notify(); }
function patchRecordLocally(id, fields){ Object.assign(state.records.find(r=>r.id===id) || {}, fields); }
function filteredRecords(){
  const f = state.filters;
  return state.records.filter(r => {
    if (f.search){
      const q = f.search.toLowerCase();
      if (!`${r.Description||""} ${r.Notes||""}`.toLowerCase().includes(q)) return false;
    }
    if (f.priorite && r.Priorite !== f.priorite) return false;
    if (f.type && r.Type !== f.type) return false;
    if (f.assignee && !decodeChoiceList(r.AssigneA).includes(f.assignee)) return false;
    return true;
  });
}

/* ===== UI (rendu + interactions) ===== */
const escapeHtml = str => String(str ?? "").replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
const fieldRow = (label, html) => `<div class="field"><label>${label}</label>${html}</div>`;
function showToast(msg){
  let t = document.getElementById("toast");
  if (!t){
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s;max-width:80vw;text-align:center;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => { t.style.opacity = "0"; }, 4500);
}
// Point d'écriture générique : factorise essai/erreur/toast/indicateur de synchronisation
// pour toutes les écritures Grist (créer, modifier, supprimer, réordonner...).
let pendingWrites = 0;
function updateSyncIndicator(){ document.getElementById("syncIndicator").classList.toggle("hidden", pendingWrites === 0); }
async function writeToGrist(action, errorMsg){
  pendingWrites++; updateSyncIndicator();
  try{ return await action(); }
  catch(e){ console.error(errorMsg, e); showToast(`⚠️ ${errorMsg}`); return undefined; }
  finally{ pendingWrites--; updateSyncIndicator(); }
}

function launchConfetti(x, y){
  const canvas = document.getElementById("confetti-canvas");
  canvas.width = innerWidth; canvas.height = innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93"];
  const LIFE = 300; // ~5s à 60 images/seconde
  const particles = Array.from({length:90}, () => ({
    x, y, vx:(Math.random()-.5)*4, vy:Math.random()*-6-3, size:Math.random()*6+4,
    color: colors[Math.random()*colors.length|0], rot:Math.random()*360, vr:(Math.random()-.5)*6, life:0,
  }));
  (function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of particles){
      p.vy += .05; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      if (p.life < LIFE){
        alive = true;
        const fade = p.life > LIFE-50 ? (LIFE-p.life)/50 : 1;
        ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); ctx.restore();
      }
    }
    if (alive) requestAnimationFrame(step); else ctx.clearRect(0,0,canvas.width,canvas.height);
  })();
}
// Effet générique : fait "exploser" un émoji en plusieurs exemplaires depuis (x,y),
// via l'API Web Animations (pas de canvas, pas de feuille de style à injecter).
function launchEmojiBurst(emoji, x, y){
  for (let i = 0; i < 16; i++){
    const el = document.createElement("div");
    el.textContent = emoji;
    el.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-size:${18+Math.random()*18}px;pointer-events:none;z-index:100;`;
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2, dist = 70+Math.random()*160;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist - 60;
    const rot = (Math.random()-.5)*180;
    const duration = 4500+Math.random()*1000; // ~5s
    const anim = el.animate([
      { transform:"translate(0,0) rotate(0deg) scale(.6)", opacity:1, offset:0 },
      { transform:`translate(${dx*.6}px,${dy*.6}px) rotate(${rot*.6}deg) scale(1)`, opacity:1, offset:.6 },
      { transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(1.15)`, opacity:0, offset:1 },
    ], { duration, easing:"ease-out", fill:"forwards" });
    anim.onfinish = () => el.remove();
  }
}
function launchEffect(lane, x, y){
  const effect = lane?.effect;
  if (!effect || effect === "none") return;
  if (effect === "confetti") return launchConfetti(x, y);
  if (effect === "custom") return lane.customEmoji && launchEmojiBurst(lane.customEmoji, x, y);
  const def = EFFECTS[effect];
  if (def?.emoji) launchEmojiBurst(def.emoji, x, y);
}

/* -- Export CSV (partagé Kanban + Tableau de bord) -- */
const csvEscape = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function csvValue(r, col){
  if (["AssigneA","Responsable","CreePar"].includes(col)) return decodeChoiceList(r[col]).join("; ");
  if (["Deadline","CreeLe","DerniereMaj"].includes(col)) return fmtDate(gristDateToJS(r[col]));
  return r[col] ?? "";
}
function exportCsv(){
  const cols = ["Description","Priorite","Statut","Deadline","AssigneA","RefProjet","Type","Responsable","CreePar","CreeLe","DerniereMaj","Notes"];
  const rows = filteredRecords();
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => csvEscape(csvValue(r,c))).join(","))].join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `kanban-export-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* -- Rendu du tableau Kanban -- */
function renderBoard(){
  refreshFilterOptions();
  const board = document.getElementById("board");
  if (!state.columnsConfig){ board.innerHTML = '<p style="padding:20px;color:#888">Chargement…</p>'; return; }
  const records = filteredRecords();
  board.innerHTML = state.columnsConfig.map(lane => {
    const tasks = tasksForLane(records, lane);
    const collapsed = state.collapsed.has(lane.id);
    return `
      <div class="lane${collapsed ? " collapsed" : ""}" data-lane-id="${lane.id}">
        <div class="lane-header" data-toggle="${lane.id}">
          <span class="lane-color-dot" style="background:${lane.color}"></span>
          <span class="lane-title">${escapeHtml(lane.label)}</span>
          <span class="lane-count">${tasks.length}</span>
          <button class="lane-collapse-btn">${collapsed ? "▶" : "▼"}</button>
        </div>
        <div class="lane-body" data-drop-lane="${lane.id}">${tasks.map(t => renderCard(t, lane)).join("")}</div>
        <button class="lane-add-card" data-add-lane="${lane.id}">+ Ajouter une carte</button>
      </div>`;
  }).join("");
}

function renderCard(t, lane){
  const pStyle = priorityStyle(t.Priorite);
  const deadline = gristDateToJS(t.Deadline);
  const overdue = deadline && deadline < new Date() && lane.sortByDeadline;
  const assignees = decodeChoiceList(t.AssigneA);
  const cl = checklistProgress(t.Checklist);
  return `
    <div class="card" draggable="true" data-id="${t.id}" style="background:${pStyle.bg};transform:rotate(${seededRotation(t.id).toFixed(2)}deg)">
      <div class="card-meta-row">
        <span class="badge" style="background:${pStyle.badge}">${escapeHtml(t.Priorite||"—")}</span>
        ${t.Type ? `<span class="chip">${escapeHtml(t.Type)}</span>` : ""}
        ${cl ? `<span class="chip">✅ ${cl.done}/${cl.total}</span>` : ""}
      </div>
      <div class="card-desc" contenteditable="true" data-field="Description" data-id="${t.id}">${escapeHtml(t.Description||"")}</div>
      ${assignees.length ? `<div class="card-meta-row">${assignees.map(a=>`<span class="chip">👤 ${escapeHtml(a)}</span>`).join("")}</div>` : ""}
      <div class="deadline-row ${overdue ? "overdue" : ""}">📅 <input type="date" data-field="Deadline" data-id="${t.id}" value="${toDateInputValue(deadline)}"></div>
      ${t.RefProjet ? `<div class="card-ref">Réf: ${escapeHtml(t.RefProjet)}</div>` : ""}
    </div>`;
}

async function handleAddCard(laneId){
  const lane = state.columnsConfig.find(l => l.id === laneId);
  if (!lane) return;
  const fields = defaultTaskFields(lane.statut);
  // Affichage immédiat, avant même la confirmation de Grist.
  const tempId = -Date.now();
  state.records.push({ id: tempId, ...fields });
  notify();
  const result = await writeToGrist(() => createTask(fields), "Tâche non enregistrée dans Grist — vérifiez l'autorisation d'accès du widget.");
  const realId = result?.id ?? (Array.isArray(result) ? result[0]?.id : undefined);
  if (realId){
    const rec = state.records.find(r => r.id === tempId);
    if (rec) rec.id = realId; // évite qu'une édition immédiate cible le mauvais id
  }
}

/* -- Édition inline de la description, avec sauvegarde différée (debounce) -- */
const descSaveTimers = new Map();
function flushDescriptionSave(id, val){
  clearTimeout(descSaveTimers.get(id));
  descSaveTimers.delete(id);
  writeToGrist(() => updateTaskFields(id, { Description: val }), "Description non enregistrée dans Grist.");
  patchRecordLocally(id, { Description: val });
}
function scheduleDescriptionSave(id, val){
  clearTimeout(descSaveTimers.get(id));
  descSaveTimers.set(id, setTimeout(() => flushDescriptionSave(id, val), 500));
}

function getDragAfterElement(container, y){
  const cards = [...container.querySelectorAll(".card:not(.dragging)")];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
  }, { offset: -Infinity, element: null }).element;
}

// Délégation d'événements : posée UNE FOIS sur #board, jamais ré-attachée au rendu.
let dragFromLaneId = null;
function initBoardEvents(){
  const board = document.getElementById("board");

  board.addEventListener("click", e => {
    const toggle = e.target.closest("[data-toggle]");
    if (toggle){ const id = toggle.dataset.toggle; state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id); return notify(); }
    const addBtn = e.target.closest("[data-add-lane]");
    if (addBtn) return handleAddCard(addBtn.dataset.addLane);
    if (e.target.closest("[data-field]")) return; // édition inline : ne pas ouvrir la popup
    const card = e.target.closest(".card");
    if (card) openTaskModal(Number(card.dataset.id));
  });

  board.addEventListener("input", e => {
    const el = e.target.closest('[data-field="Description"]');
    if (el) scheduleDescriptionSave(Number(el.dataset.id), el.textContent.trim());
  });
  board.addEventListener("focusout", e => {
    const el = e.target.closest('[data-field="Description"]');
    if (el) flushDescriptionSave(Number(el.dataset.id), el.textContent.trim());
  });
  board.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest('[data-field="Description"]')){ e.preventDefault(); e.target.blur(); }
  });

  board.addEventListener("change", e => {
    const el = e.target.closest('input[data-field="Deadline"]');
    if (!el) return;
    const id = Number(el.dataset.id), epoch = jsDateToGristEpoch(el.value);
    writeToGrist(() => updateTaskFields(id, { Deadline: epoch }), "Deadline non enregistrée dans Grist.");
    patchRecordLocally(id, { Deadline: epoch });
    notify();
  });

  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    card.classList.add("dragging");
    dragFromLaneId = card.closest(".lane")?.dataset.laneId || null;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
  });
  board.addEventListener("dragend", e => { e.target.closest(".card")?.classList.remove("dragging"); dragFromLaneId = null; });
  board.addEventListener("dragover", e => {
    const zone = e.target.closest("[data-drop-lane]");
    if (!zone) return;
    e.preventDefault();
    zone.classList.add("drag-over");
    // Réordonnancement visuel en direct, uniquement à l'intérieur de la colonne d'origine.
    if (zone.dataset.dropLane === dragFromLaneId){
      const dragging = document.querySelector(".card.dragging");
      if (dragging){
        const after = getDragAfterElement(zone, e.clientY);
        after ? zone.insertBefore(dragging, after) : zone.appendChild(dragging);
      }
    }
  });
  board.addEventListener("dragleave", e => e.target.closest("[data-drop-lane]")?.classList.remove("drag-over"));
  board.addEventListener("drop", e => {
    const zone = e.target.closest("[data-drop-lane]");
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove("drag-over");
    const id = Number(e.dataTransfer.getData("text/plain"));
    const lane = state.columnsConfig.find(l => l.id === zone.dataset.dropLane);
    const rec = state.records.find(r => r.id === id);
    if (!lane || !rec){ dragFromLaneId = null; return; }
    const sameLane = zone.dataset.dropLane === dragFromLaneId;
    const wasDifferent = rec.Statut !== lane.statut;

    if (sameLane){
      // Ré-assigne un "Ordre" séquentiel selon la position visuelle finale dans la colonne.
      [...zone.querySelectorAll(".card")].forEach((cardEl, i) => {
        const cardId = Number(cardEl.dataset.id);
        const r = state.records.find(x => x.id === cardId);
        const newOrder = (i+1)*10;
        if (r && r.Ordre !== newOrder){
          r.Ordre = newOrder;
          writeToGrist(() => updateTaskFields(cardId, { Ordre: newOrder }), "Ordre non enregistré dans Grist.");
        }
      });
    } else {
      const maxOrder = state.records.filter(r => r.Statut === lane.statut).reduce((m,r) => Math.max(m, r.Ordre||0), 0);
      const histLine = `${fmtDateTime(new Date())} : ${rec.Statut || "—"} → ${lane.statut}`;
      const fields = { Statut: lane.statut, Ordre: maxOrder+10, Historique: (rec.Historique ? rec.Historique+"\n" : "")+histLine };
      writeToGrist(() => updateTaskFields(id, fields), "Déplacement non enregistré dans Grist.");
      Object.assign(rec, fields);
    }
    notify();
    if (wasDifferent) launchEffect(lane, innerWidth/2, innerHeight/2);
    dragFromLaneId = null;
  });
}

/* -- Popup détail tâche (utilisée depuis Kanban, Calendrier et Tableau de bord) -- */
let modalChecklist = [];
function checklistItemsHtml(items){
  return `<div id="checklist-items">${items.map((it,i) => `
    <div class="checklist-item" data-idx="${i}">
      <input type="checkbox" data-chk="done" ${it.done?"checked":""}>
      <input type="text" data-chk="text" value="${escapeHtml(it.text||"")}" placeholder="Sous-tâche…">
      <button type="button" class="icon-btn" data-chk="del">✕</button>
    </div>`).join("")}</div>`;
}
function refreshChecklistUI(){
  document.getElementById("checklist-items").outerHTML = checklistItemsHtml(modalChecklist);
}
function initTaskModalEvents(){
  const modal = document.getElementById("taskModal");
  modal.addEventListener("click", e => {
    if (e.target.closest("#checklist-add")){ modalChecklist.push({ text:"", done:false }); refreshChecklistUI(); return; }
    const del = e.target.closest('[data-chk="del"]');
    if (del){ modalChecklist.splice(Number(del.closest(".checklist-item").dataset.idx), 1); refreshChecklistUI(); }

    const chk = e.target.closest('[data-chk="done"]');
    if (chk) modalChecklist[Number(chk.closest(".checklist-item").dataset.idx)].done = chk.checked;
  });
}

  document.getElementById("taskModal").innerHTML = `
    <h2>Détail de la tâche</h2>
    ${fieldRow("Description", `<textarea id="m-desc">${escapeHtml(t.Description||"")}</textarea>`)}

      ${fieldRow("Priorité", `<select id="m-priorite">${opts(priorities, t.Priorite)}</select>`)}
      ${fieldRow("Statut", `<select id="m-statut">${opts(statutOptions, t.Statut)}</select>`)}
    </div>
    <div class="field-row">
      ${fieldRow("Deadline", `<input type="date" id="m-deadline" value="${toDateInputValue(gristDateToJS(t.Deadline))}">`)}
      ${fieldRow("Type", `<input type="text" id="m-type" value="${escapeHtml(t.Type||"")}">`)}
    </div>
    ${fieldRow("Référence du Projet", `<input type="text" id="m-ref" value="${escapeHtml(t.RefProjet||"")}">`)}
    <div class="field-row">
      ${fieldRow("Assigné à (virgules)", `<input type="text" id="m-assigne" value="${escapeHtml(decodeChoiceList(t.AssigneA).join(", "))}">`)}
      ${fieldRow("Responsable (virgules)", `<input type="text" id="m-resp" value="${escapeHtml(decodeChoiceList(t.Responsable).join(", "))}">`)}
    </div>
    ${fieldRow("Notes", `<textarea id="m-notes">${escapeHtml(t.Notes||"")}</textarea>`)}
    <div class="field">

async function deleteTaskModal(id){
  const t = state.records.find(r => r.id === id);
  if (!confirm(`Supprimer définitivement la tâche "${t?.Description || "sans titre"}" ?`)) return;
  await writeToGrist(() => deleteTask(id), "Suppression non enregistrée dans Grist.");
  state.records = state.records.filter(r => r.id !== id);
  closeTaskModal();
  notify();
}

async function saveTaskModal(){
  const id = state.editingId, t = state.records.find(r => r.id === id);
  const val = sel => document.getElementById(sel).value.trim();
  const newStatut = document.getElementById("m-statut").value;
  const laneForNewStatut = state.columnsConfig.find(l => l.statut === newStatut);
  const wasDifferentStatut = t && t.Statut !== newStatut;
  const historique = wasDifferentStatut
    ? (t.Historique ? t.Historique+"\n" : "") + `${fmtDateTime(new Date())} : ${t.Statut || "—"} → ${newStatut}`
    : (t.Historique || "");

  const fields = {
    Description: val("m-desc"), Priorite: document.getElementById("m-priorite").value, Statut: newStatut,
    Deadline: jsDateToGristEpoch(document.getElementById("m-deadline").value),
    Type: val("m-type"), RefProjet: val("m-ref"),
    AssigneA: encodeChoiceList(val("m-assigne").split(",").map(s=>s.trim()).filter(Boolean)),
    Responsable: encodeChoiceList(val("m-resp").split(",").map(s=>s.trim()).filter(Boolean)),
    Notes: val("m-notes"),
    Checklist: JSON.stringify(modalChecklist.filter(it => it.text.trim() !== "")),
    Historique: historique,
  };
  await writeToGrist(() => updateTaskFields(id, fields), "Modifications non enregistrées dans Grist.");
  patchRecordLocally(id, fields);
  closeTaskModal();
  notify();
  if (wasDifferentStatut) launchEffect(laneForNewStatut, innerWidth/2, innerHeight/2);
}

/* ===== ONGLET CALENDRIER ===== */
let calYear, calMonth;
(function initCalDate(){ const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); })();

function renderCalendar(){
  const grid = document.getElementById("calendarGrid");
  const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  document.getElementById("calLabel").textContent = `${monthNames[calMonth]} ${calYear}`;

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const startWeekday = (firstOfMonth.getDay()+6)%7; // lundi = 0
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const tasksByDay = {};
  state.records.forEach(r => {
    const d = gristDateToJS(r.Deadline);
    if (!d) return;
    (tasksByDay[toDateInputValue(d)] = tasksByDay[toDateInputValue(d)] || []).push(r);
  });

  const cells = [];
  for (let i = startWeekday-1; i >= 0; i--) cells.push({ day: daysInPrevMonth-i, muted:true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day:d, muted:false, dateObj:new Date(calYear,calMonth,d) });
  let extra = 1;
  while (cells.length % 7 !== 0) cells.push({ day: extra++, muted:true });

  const todayKey = toDateInputValue(new Date());
  const weekdayLabels = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  grid.innerHTML = `
    <div class="cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-days">
      ${cells.map(c => {
        if (c.muted) return `<div class="cal-day muted"><span class="cal-daynum">${c.day}</span></div>`;
        const key = toDateInputValue(c.dateObj);
        const tasks = tasksByDay[key] || [];
        return `<div class="cal-day${key===todayKey?" today":""}">
          <span class="cal-daynum">${c.day}</span>
          <div class="cal-day-tasks">
            ${tasks.slice(0,3).map(t => `<div class="cal-task" data-cal-task="${t.id}" style="background:${priorityStyle(t.Priorite).badge}">${escapeHtml(t.Description||"")}</div>`).join("")}
            ${tasks.length>3 ? `<div class="cal-more">+${tasks.length-3}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}
function initCalendar(){
  document.getElementById("calPrev").onclick = () => { calMonth--; if (calMonth<0){ calMonth=11; calYear--; } renderCalendar(); };
  document.getElementById("calNext").onclick = () => { calMonth++; if (calMonth>11){ calMonth=0; calYear++; } renderCalendar(); };
  document.getElementById("calToday").onclick = () => { const n=new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); renderCalendar(); };
  document.getElementById("calendarGrid").addEventListener("click", e => {

/* ===== ONGLET WHITEBOARD ===== */
let wbStrokes = [];      // traits de dessin libre (raster, sur <canvas>)
let wbElements = [];     // formes/texte/post-it (DOM, dans #wbOverlay)
let wbCurrentStroke = null;
let wbDraftStart = null; // brouillon en cours de création (rectangle/ellipse en cours de tracé)
let wbActiveEl = null;   // élément en cours de déplacement/redimensionnement
let wbSelectedId = null;
let wbColor = "#222222";
let wbSize = 3;
let wbTool = "pen"; // pen | eraser | rect | ellipse | text | sticky | select
let wbSaveTimer = null;

function wbRedraw(){
  const canvas = document.getElementById("wbCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  wbStrokes.forEach(s => {
    if (s.points.length < 2) return;
    ctx.strokeStyle = s.erase ? "#ffffff" : s.color;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    s.points.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.stroke();
  });
}
function wbResizeCanvas(){
  const canvas = document.getElementById("wbCanvas");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  wbRedraw();
}
function wbSaveDebounced(){
  clearTimeout(wbSaveTimer);
  wbSaveTimer = setTimeout(() => saveWhiteboardData({ strokes: wbStrokes, elements: wbElements }), 800);
}
function loadWhiteboardData(raw){
  const data = raw || loadLocalWhiteboard() || { strokes: [], elements: [] };
  if (Array.isArray(data)){ wbStrokes = data; wbElements = []; } // compat. avec l'ancien format (traits seuls)
  else { wbStrokes = data.strokes || []; wbElements = data.elements || []; }
  if (document.getElementById("wbCanvas").width){ wbRedraw(); renderWbOverlay(); }
}
function updateWbToolbarUI(){
  document.querySelectorAll("[data-wb-tool]").forEach(b => b.classList.toggle("active", b.dataset.wbTool === wbTool));
  document.querySelectorAll("[data-wb-color]").forEach(b => b.classList.toggle("active", b.dataset.wbColor === wbColor));
}

// -- Formes/texte/post-it (couche DOM au-dessus du canvas) --
function wbCreateElement(type, x, y){
  const defaults = { rect:{w:140,h:90}, ellipse:{w:140,h:90}, text:{w:170,h:50}, sticky:{w:160,h:140} };
  const d = defaults[type] || { w:120, h:80 };
  return { id: cid(), type, x, y, w:d.w, h:d.h, color: type==="sticky" ? "#fff6b8" : wbColor, text:"" };
}
function wbHandlesHtml(){
  return `<span class="wb-del" data-wb-del title="Supprimer">✕</span><span class="wb-resize" data-wb-resize title="Redimensionner"></span>`;
}
function wbElementHtml(el){
  const style = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
  if (el.type === "rect")
    return `<div class="wb-el" data-id="${el.id}" data-type="rect" style="${style}"><div class="wb-shape-inner" style="border:3px solid ${el.color};border-radius:6px;"></div>${wbHandlesHtml()}</div>`;
  if (el.type === "ellipse")
    return `<div class="wb-el" data-id="${el.id}" data-type="ellipse" style="${style}"><div class="wb-shape-inner" style="border:3px solid ${el.color};border-radius:50%;"></div>${wbHandlesHtml()}</div>`;
  if (el.type === "text")
    return `<div class="wb-el" data-id="${el.id}" data-type="text" style="${style}">
      <div class="wb-draghandle" data-wb-drag>⠿</div>
      <div class="wb-content" contenteditable="true" style="color:${el.color};">${escapeHtml(el.text)}</div>
      ${wbHandlesHtml()}
    </div>`;
  if (el.type === "sticky")
    return `<div class="wb-el" data-id="${el.id}" data-type="sticky" style="${style}">
      <div class="wb-draghandle" data-wb-drag>⠿</div>
      <div class="wb-content wb-sticky-content" contenteditable="true" style="background:${el.color};">${escapeHtml(el.text)}</div>
      ${wbHandlesHtml()}
    </div>`;
  return "";
}
function renderWbOverlay(){
  document.getElementById("wbOverlay").innerHTML = wbElements.map(wbElementHtml).join("");
  if (wbSelectedId) wbSelectElement(wbSelectedId);
}
function wbSelectElement(id){
  wbSelectedId = id;
  document.querySelectorAll(".wb-el").forEach(d => d.classList.toggle("selected", d.dataset.id === id));
}

// -- Interactions sur le canvas (dessin libre + création de formes/texte/post-it) --
function wbWrapPointerDown(e){
  const wrap = e.currentTarget;
  wrap.setPointerCapture?.(e.pointerId);
  const rect = wrap.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;

  if (wbTool === "pen" || wbTool === "eraser"){
    wbCurrentStroke = { color: wbColor, size: wbSize, erase: wbTool === "eraser", points: [[x,y]] };
    wbStrokes.push(wbCurrentStroke);
    return;
  }
  if (wbTool === "rect" || wbTool === "ellipse"){
    wbDraftStart = { x, y, type: wbTool };
    const draft = document.createElement("div");
    draft.id = "wbDraft";
    draft.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:0;height:0;border:2px dashed ${wbColor};border-radius:${wbTool==="ellipse"?"50%":"6px"};pointer-events:none;`;
    document.getElementById("wbOverlay").appendChild(draft);
    return;
  }
  if (wbTool === "text" || wbTool === "sticky"){
    const el = wbCreateElement(wbTool, x, y);
    wbElements.push(el);
    renderWbOverlay();
    wbSelectElement(el.id);
    wbTool = "select"; updateWbToolbarUI();
    requestAnimationFrame(() => document.querySelector(`.wb-el[data-id="${el.id}"] .wb-content`)?.focus());
    wbSaveDebounced();
    return;
  }
  // wbTool === "select" : clic dans le vide -> désélection (le clic sur un élément est intercepté par #wbOverlay)
  wbSelectElement(null);
}
function wbWrapPointerMove(e){
  const wrap = e.currentTarget;
  const rect = wrap.getBoundingClientRect();
  if (wbCurrentStroke){
    wbCurrentStroke.points.push([e.clientX-rect.left, e.clientY-rect.top]);
    wbRedraw();
    return;
  }
  if (wbDraftStart){
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    const draft = document.getElementById("wbDraft");
    if (!draft) return;
    Object.assign(draft.style, {
      left: Math.min(x, wbDraftStart.x)+"px", top: Math.min(y, wbDraftStart.y)+"px",
      width: Math.abs(x-wbDraftStart.x)+"px", height: Math.abs(y-wbDraftStart.y)+"px",
    });
  }
}
function wbWrapPointerUp(){
  if (wbCurrentStroke){ wbCurrentStroke = null; wbSaveDebounced(); return; }
  if (wbDraftStart){
    const draft = document.getElementById("wbDraft");
    const w = parseFloat(draft.style.width) || 0, h = parseFloat(draft.style.height) || 0;
    if (w > 10 && h > 10){
      const el = wbCreateElement(wbDraftStart.type, parseFloat(draft.style.left), parseFloat(draft.style.top));
      el.w = w; el.h = h;
      wbElements.push(el);
      renderWbOverlay();
      wbSelectElement(el.id);
      wbSaveDebounced();
    }
    draft.remove();
    wbDraftStart = null;
    wbTool = "select"; updateWbToolbarUI();
  }
}

// -- Interactions sur les éléments existants (sélection, déplacement, redimensionnement, édition, suppression) --
function initWbOverlayEvents(){
  const overlay = document.getElementById("wbOverlay");
  overlay.addEventListener("pointerdown", e => {
    const elDiv = e.target.closest(".wb-el");
    if (!elDiv) return;
    e.stopPropagation(); // empêche le canvas en dessous de démarrer un trait/une forme en même temps

    const delBtn = e.target.closest("[data-wb-del]");
    if (delBtn){
      wbElements = wbElements.filter(x => x.id !== elDiv.dataset.id);
      if (wbSelectedId === elDiv.dataset.id) wbSelectedId = null;
      renderWbOverlay();
      wbSaveDebounced();
      return;
    }

    wbSelectElement(elDiv.dataset.id);

    const resizeHandle = e.target.closest("[data-wb-resize]");
    const dragHandle = e.target.closest("[data-wb-drag]");
    const type = elDiv.dataset.type;
    const isShapeBody = (type === "rect" || type === "ellipse") && !resizeHandle;

    if (resizeHandle || dragHandle || isShapeBody){
      e.preventDefault(); // évite la sélection de texte pendant le glisser ; ne bloque pas l'édition (voir plus bas)
      const el = wbElements.find(x => x.id === elDiv.dataset.id);
      wbActiveEl = { id: el.id, mode: resizeHandle ? "resize" : "move", startX: e.clientX, startY: e.clientY, orig: { x: el.x, y: el.y, w: el.w, h: el.h } };
      overlay.setPointerCapture(e.pointerId);
    }
  });
  overlay.addEventListener("pointermove", e => {
    if (!wbActiveEl) return;
    const el = wbElements.find(x => x.id === wbActiveEl.id);
    const div = overlay.querySelector(`.wb-el[data-id="${wbActiveEl.id}"]`);
    if (!el || !div) return;
    const dx = e.clientX - wbActiveEl.startX, dy = e.clientY - wbActiveEl.startY;
    if (wbActiveEl.mode === "move"){
      el.x = wbActiveEl.orig.x + dx; el.y = wbActiveEl.orig.y + dy;
      div.style.left = el.x + "px"; div.style.top = el.y + "px";
    } else {
      el.w = Math.max(30, wbActiveEl.orig.w + dx); el.h = Math.max(24, wbActiveEl.orig.h + dy);
      div.style.width = el.w + "px"; div.style.height = el.h + "px";
    }
  });
  const endActive = () => { if (wbActiveEl){ wbActiveEl = null; wbSaveDebounced(); } };
  overlay.addEventListener("pointerup", endActive);
  overlay.addEventListener("pointerleave", endActive);
  overlay.addEventListener("input", e => {
    const content = e.target.closest(".wb-content");
    if (!content) return;
    const el = wbElements.find(x => x.id === content.closest(".wb-el").dataset.id);
    if (el){ el.text = content.textContent; wbSaveDebounced(); }
  });
}

function initWhiteboard(){
  const wrap = document.getElementById("wbCanvasWrap");
  window.addEventListener("resize", () => { if (currentTab === "whiteboard") wbResizeCanvas(); });
  wrap.addEventListener("pointerdown", wbWrapPointerDown);
  wrap.addEventListener("pointermove", wbWrapPointerMove);
  wrap.addEventListener("pointerup", wbWrapPointerUp);
  wrap.addEventListener("pointerleave", wbWrapPointerUp);
  initWbOverlayEvents();

  document.getElementById("wbToolbar").addEventListener("click", e => {
    const toolBtn = e.target.closest("[data-wb-tool]");
    if (toolBtn){ wbTool = toolBtn.dataset.wbTool; updateWbToolbarUI(); return; }
    const colorBtn = e.target.closest("[data-wb-color]");
    if (colorBtn){ wbColor = colorBtn.dataset.wbColor; updateWbToolbarUI(); return; }
    if (e.target.closest("#wbClear")){
      if (confirm("Effacer tout le whiteboard (traits, formes, textes, post-its) ? Cette action est irréversible.")){
        wbStrokes = []; wbElements = []; wbSelectedId = null;
        wbRedraw(); renderWbOverlay(); wbSaveDebounced();
      }
    }
  });
  document.getElementById("wbSize").addEventListener("input", e => { wbSize = Number(e.target.value); });
}

/* ===== ONGLET TABLEAU DE BORD ===== */
function computeDashboardStats(){
  const laneByStatut = {};
  (state.columnsConfig||[]).forEach(l => laneByStatut[l.statut] = l);
  const now = new Date();
  let done=0, doing=0, overdue=0;
  const byStatut={}, byPriorite={}, byPerson={};
  state.records.forEach(r => {
    const lane = laneByStatut[r.Statut];
    const cat = lane?.dashCategory || "todo";
    if (cat === "done") done++;
    if (cat === "doing") doing++;
    const d = gristDateToJS(r.Deadline);
    if (d && d < now && cat !== "done" && cat !== "cancelled") overdue++;
    const statutLabel = r.Statut || "—";
    byStatut[statutLabel] = (byStatut[statutLabel]||0)+1;
    byPriorite[r.Priorite||"—"] = (byPriorite[r.Priorite||"—"]||0)+1;
    decodeChoiceList(r.AssigneA).forEach(name => {
      byPerson[name] = byPerson[name] || { total:0, doing:0 };
      byPerson[name].total++;
      if (cat === "doing") byPerson[name].doing++;
    });
  });
  return { total: state.records.length, done, doing, overdue, byStatut, byPriorite, byPerson, laneByStatut };
}
function renderDonutSVG(segments, size=130, thickness=20){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size-thickness)/2, circ = 2*Math.PI*r;
  let offset = 0;
  const circles = segments.map(seg => {
    const dash = (seg.value/total)*circ;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += dash;
    return el;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="var(--ink)">${total}</text></svg>`;
}
function renderModule(id){
  const stats = computeDashboardStats();
  if (id === "kpis"){
    return `<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value">${stats.total}</div><div class="kpi-label">Total</div></div>
      <div class="kpi-card"><div class="kpi-value">${stats.doing}</div><div class="kpi-label">En cours</div></div>
      <div class="kpi-card"><div class="kpi-value">${stats.done}</div><div class="kpi-label">Terminées</div></div>
      <div class="kpi-card"><div class="kpi-value" style="${stats.overdue?'color:#c0392b':''}">${stats.overdue}</div><div class="kpi-label">En retard</div></div>
    </div>`;
  }
  if (id === "donutStatut"){
    const entries = Object.entries(stats.byStatut);
    if (!entries.length) return `<p style="font-size:12px;color:var(--muted);">Aucune donnée.</p>`;
    const segments = entries.map(([statut,count]) => ({ value:count, color: stats.laneByStatut[statut]?.color || "#999", label:statut }));
    return `<div class="donut-wrap">${renderDonutSVG(segments)}<div class="donut-legend">${segments.map(s=>`<div><span class="donut-legend-dot" style="background:${s.color}"></span>${escapeHtml(s.label)} (${s.value})</div>`).join("")}</div></div>`;
  }
  if (id === "barsPriorite"){
    const priorities = Object.keys(PRIORITY_COLORS).filter(k=>k!=="__default");
    const max = Math.max(1, ...priorities.map(p => stats.byPriorite[p]||0));
    return priorities.map(p => {
      const count = stats.byPriorite[p]||0, pct = Math.round(count/max*100);
      return `<div class="bar-row">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;"><span>${p}</span><span>${count}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${priorityStyle(p).badge}"></div></div>
      </div>`;
    }).join("");
  }
  if (id === "teamLoad"){
    const names = Object.keys(stats.byPerson).sort((a,b)=>a.localeCompare(b,"fr"));
    if (!names.length) return `<p style="font-size:12px;color:var(--muted);">Aucune tâche assignée.</p>`;
    return `<table style="width:100%;font-size:12.5px;border-collapse:collapse;">
      <tr style="text-align:left;color:var(--muted);"><th style="padding:4px 0;">Personne</th><th>Total</th><th>En cours</th></tr>
      ${names.map(n=>`<tr><td style="padding:4px 0;">${escapeHtml(n)}</td><td>${stats.byPerson[n].total}</td><td>${stats.byPerson[n].doing}</td></tr>`).join("")}
    </table>`;
  }
  if (id === "deadlines"){
    const withDeadline = state.records.filter(r=>r.Deadline).sort((a,b)=>gristDateToJS(a.Deadline)-gristDateToJS(b.Deadline));
    if (!withDeadline.length) return `<p style="font-size:12px;color:var(--muted);">Aucune échéance définie.</p>`;
    const now = new Date();
    return withDeadline.map(r => {
      const d = gristDateToJS(r.Deadline), overdue = d < now;
      return `<div data-cal-task="${r.id}" style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:12.5px;cursor:pointer;">
        <span>${escapeHtml(r.Description||"(sans titre)")}</span>
        <span style="${overdue?'color:#c0392b;font-weight:700;':''}">${fmtDate(d)}</span>
      </div>`;
    }).join("");
  }
  return "";
}
function renderDashboard(){
  const grid = document.getElementById("dashboardGrid");
  if (!state.dashboardLayout){ grid.innerHTML = ""; return; }
  const visible = state.dashboardLayout.filter(m => m.visible && DASHBOARD_MODULES[m.id]);
  grid.innerHTML = visible.length ? visible.map(m => `
    <div class="dash-module${DASHBOARD_MODULES[m.id].full ? " full" : ""}">
      <h3>${escapeHtml(DASHBOARD_MODULES[m.id].label)}</h3>
      ${renderModule(m.id)}
    </div>`).join("") : `<p style="padding:20px;color:#888;">Aucun module actif — cliquez sur ⚙️ Personnaliser pour en ajouter.</p>`;
}
function initDashboard(){
  document.getElementById("dashboardGrid").addEventListener("click", e => {
    const t = e.target.closest("[data-cal-task]");
    if (t) openTaskModal(Number(t.dataset.calTask));
  });
  document.getElementById("btnDashExport").onclick = exportCsv;
  document.getElementById("btnDashConfig").onclick = openDashConfigModal;
}

/* -- Popup de personnalisation du tableau de bord -- */
let dashWorkingCopy = [];
function openDashConfigModal(){
  dashWorkingCopy = (state.dashboardLayout || defaultDashboardLayout()).map(m => ({ ...m }));
  Object.keys(DASHBOARD_MODULES).forEach(id => { if (!dashWorkingCopy.find(m => m.id === id)) dashWorkingCopy.push({ id, visible:false }); });
  renderDashConfigModal();
  document.getElementById("dashConfigOverlay").classList.remove("hidden");
}
const closeDashConfigModal = () => document.getElementById("dashConfigOverlay").classList.add("hidden");
function renderDashConfigModal(){
  const cfg = dashWorkingCopy;
  document.getElementById("dashConfigModal").innerHTML = `
    <h2>Personnaliser le tableau de bord</h2>
    <div id="dash-config-list">
      ${cfg.map((m,i) => `
        <div class="dash-config-row" data-idx="${i}">
          <button class="icon-btn" data-move="up" ${i===0?'disabled style="opacity:.3"':""}>↑</button>
          <button class="icon-btn" data-move="down" ${i===cfg.length-1?'disabled style="opacity:.3"':""}>↓</button>
          <label style="flex:1;display:flex;align-items:center;gap:6px;"><input type="checkbox" data-dash-visible ${m.visible?"checked":""}> ${escapeHtml(DASHBOARD_MODULES[m.id]?.label || m.id)}</label>
        </div>`).join("")}
    </div>
    <div class="modal-footer">
      <button class="btn secondary" id="dc-close">Annuler</button>
      <button class="btn" id="dc-save">Enregistrer</button>
    </div>`;
  document.getElementById("dash-config-list").addEventListener("click", e => {
    const row = e.target.closest(".dash-config-row");
    if (!row) return;
    const idx = Number(row.dataset.idx);
    if (e.target.closest("[data-move]")){
      const j = idx + (e.target.dataset.move === "up" ? -1 : 1);
      if (j >= 0 && j < cfg.length){ [cfg[idx],cfg[j]] = [cfg[j],cfg[idx]]; renderDashConfigModal(); }
    }
  });
  document.getElementById("dash-config-list").addEventListener("change", e => {
    if (e.target.matches("[data-dash-visible]")){
      cfg[Number(e.target.closest(".dash-config-row").dataset.idx)].visible = e.target.checked;
    }
  });
  document.getElementById("dc-close").onclick = closeDashConfigModal;
  document.getElementById("dc-save").onclick = () => { setDashboardLayout(dashWorkingCopy); saveDashboardLayout(dashWorkingCopy); closeDashConfigModal(); };
}

/* ===== NAVIGATION PAR ONGLETS ===== */
let currentTab = "kanban";
function renderTab(tab){
  if (tab === "kanban") renderBoard();
  else if (tab === "calendar") renderCalendar();
  else if (tab === "whiteboard"){ wbResizeCanvas(); renderWbOverlay(); }
  else if (tab === "dashboard") renderDashboard();
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.getElementById("view-"+tab).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  renderTab(tab);
}

/* ===== COMPOSITION ROOT ===== */
subscribe(() => renderTab(currentTab));
initBoardEvents();
initTaskModalEvents();
initFiltersBar();
initCalendar();
initWhiteboard();
initDashboard();
updateWbToolbarUI();
document.getElementById("tabBar").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  if (btn) switchTab(btn.dataset.tab);
});

initGrist({
  onRecordsChange: setRecords,
  onOptionsChange: options => {
    setColumnsConfig(options.kanbanColumns || loadLocalColumns() || defaultColumnsConfig());
    loadWhiteboardData(options.whiteboardData);
    setDashboardLayout(options.dashboardLayout || loadLocalDashboardLayout() || defaultDashboardLayout());
  },
  onUnavailable: () => {
    setColumnsConfig(loadLocalColumns() || defaultColumnsConfig());
    loadWhiteboardData(null);
    setDashboardLayout(loadLocalDashboardLayout() || defaultDashboardLayout());
    setRecords([]);
  },
});

document.getElementById("btnSettings").onclick = openSettingsModal;
document.getElementById("btnNewCard").onclick = () => state.columnsConfig?.[0] && handleAddCard(state.columnsConfig[0].id);
document.getElementById("btnExportCsv").onclick = exportCsv;
const board = document.getElementById("board");
if (localStorage.getItem("kanban_view_mode") === "stacked") board.classList.add("stacked");
document.getElementById("btnToggleView").onclick = () => {
  const stacked = board.classList.toggle("stacked");
  localStorage.setItem("kanban_view_mode", stacked ? "stacked" : "columns");
};
</script>
</body>
