<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de Projet</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{ --bg:#eef1f5; --ink:#2b2b2b; --muted:#6b7280; --col-bg:#dfe3ea; --col-header:#c9ced8; --accent:#4f7cff; --shadow:0 3px 8px rgba(0,0,0,.18); --surface:#fff; --border:#d7dae0; }
#fSearch,#fAssignee,#fPriorite,#fType{color:#000000;}
:root[data-theme="dark"]{ --bg:#181a1f; --ink:#e8e8ea; --muted:#9aa0ab; --col-bg:#242731; --col-header:#2e323e; --accent:#5c86ff; --shadow:0 3px 10px rgba(0,0,0,.5); --surface:#20222a; --border:#333744; }
:root[data-theme="dark"] .card{box-shadow:var(--shadow);}
:root[data-theme="dark"] .modal,:root[data-theme="dark"] #wbCanvasWrap,:root[data-theme="dark"] .kpi-card,:root[data-theme="dark"] .dash-module{background:var(--surface);color:var(--ink);}
:root[data-theme="dark"] .field textarea,:root[data-theme="dark"] .field input,:root[data-theme="dark"] .field select,:root[data-theme="dark"] .sub-toolbar input[type=search],:root[data-theme="dark"] .sub-toolbar select,:root[data-theme="dark"] .lane-config-row input[type=text]{background:var(--surface);color:var(--ink);border-color:var(--border);}
:root[data-theme="dark"] #fSearch,:root[data-theme="dark"] #fAssignee,:root[data-theme="dark"] #fPriorite,:root[data-theme="dark"] #fType{color:var(--ink);}
:root[data-theme="dark"] #toolbar,:root[data-theme="dark"] .sub-toolbar{background:var(--surface);border-color:var(--border);}
:root[data-theme="dark"] .btn.secondary{background:#2c2f3a;color:var(--ink);}
:root[data-theme="dark"] .lane-count,:root[data-theme="dark"] #wbCanvasWrap{background:var(--surface);}
:root[data-theme="dark"] .cal-day{background:var(--surface);color:var(--ink);}
:root[data-theme="dark"] .stat-card{background:var(--surface);}
:root[data-theme="dark"] .pf-row:hover .pf-lbl{background:rgba(255,255,255,.04);}
:root[data-theme="dark"] .alerts-panel{background:var(--surface);color:var(--ink);}
:root[data-theme="dark"] .alerts-item:hover{background:#2c2f3a;}
:root[data-theme="dark"] .cbdd-trigger,:root[data-theme="dark"] .cbdd-panel{background:var(--surface);color:var(--ink);border-color:var(--border);}
:root[data-theme="dark"] .cbdd-item:hover{background:#2c2f3a;}
:root[data-theme="dark"] .cbdd-add{border-color:var(--border);}
:root[data-theme="dark"] .cbdd-add input{background:var(--surface);color:var(--ink);border-color:var(--border);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
#app{display:flex;flex-direction:column;height:100vh;}

/* Barre du haut + onglets */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid #d7dae0;}
#toolbar h1{font-size:15px;margin:0;color:#333;font-weight:600;}
#tabBar{display:flex;gap:4px;margin-right:auto;flex-wrap:wrap;}
.tab-btn{border:none;background:none;padding:6px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;color:#555;font-weight:500;}
.tab-btn.active{background:var(--accent);color:#fff;}
#syncIndicator{font-size:11px;color:#888;}
#syncIndicator.hidden{display:none;}
.alerts-badge{position:absolute;top:-3px;right:-3px;background:#c0392b;color:#fff;border-radius:999px;font-size:9px;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 2px;font-weight:700;}
.alerts-badge.hidden{display:none;}
.alerts-panel{position:absolute;top:100%;right:0;margin-top:6px;width:280px;max-height:320px;overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:60;padding:6px;}
.alerts-panel.hidden{display:none;}
.alerts-header{font-weight:700;font-size:12px;padding:6px 8px;color:var(--muted);}
.alerts-item{padding:7px 8px;border-radius:7px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.alerts-item:hover{background:#f5f6f9;}
.alerts-date{color:#c0392b;font-weight:700;white-space:nowrap;}
.alerts-empty{padding:16px 8px;text-align:center;color:var(--muted);font-size:12px;}

.btn{border:none;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff;font-weight:500;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.btn.secondary{background:#eceff3;color:#333;box-shadow:none;}
.btn.danger{background:#fff;color:#c0392b;border:1px solid #f0c4c0;}
.btn.danger:hover{background:#fdf1f0;}
.btn.active{background:#33508f;color:#fff;}
.btn:active{transform:translateY(1px);}
.btn:focus-visible,.tab-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.sub-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 12px;background:#fff;border-bottom:1px solid #d7dae0;}
.sub-toolbar input[type=search],.sub-toolbar select{font-size:12.5px;padding:5px 8px;border:1px solid #d7dae0;border-radius:7px;background:#fff;}
.sub-toolbar input[type=search]{flex:1;min-width:110px;}
#bulkBar{background:#eef3ff;}
#bulkBar.hidden{display:none;}
#globalStats{display:flex;gap:10px;overflow-x:auto;}
.stat-card{background:#fff;border-radius:10px;padding:6px 14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.10);min-width:70px;flex:none;}
.stat-value{font-size:18px;font-weight:800;}
.stat-label{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;}
/* Portefeuille projets : frise 12 mois + Kanban fusionné */
#pfMain{padding:14px;display:flex;flex-direction:column;gap:16px;}
.pf-timeline{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow-x:hidden;overflow-y:auto;max-height:55vh;}
.pf-head{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;background:var(--surface);}
.pf-head-lbl{min-width:200px;max-width:200px;padding:8px 12px;font-weight:700;font-size:12px;color:var(--muted);flex:none;}
.pf-months-wrap{position:relative;flex:1;}
.pf-months{display:flex;}
.pf-months>div{flex:1;padding:8px 0 8px 6px;font-size:11px;color:var(--muted);border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;box-sizing:border-box;}
.pf-months>div.year{color:var(--ink);font-weight:700;}
.pf-today-tag{position:absolute;top:2px;transform:translateX(-50%);background:#c0392b;color:#fff;font-size:10px;padding:0 6px;border-radius:8px;white-space:nowrap;}
.pf-row{display:flex;border-bottom:1px solid var(--border);cursor:pointer;min-height:52px;}
.pf-row:hover .pf-lbl{background:rgba(0,0,0,.03)}
.pf-row.dim{opacity:.35;}
.pf-lbl{min-width:200px;max-width:200px;flex:none;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;border-right:1px solid var(--border);}
.pf-lbl-name{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px;min-width:0;grid-column:1/2;}
.pf-lbl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c);}
.pf-pct{font-size:16px;font-weight:800;grid-row:span 2;}
.pf-sub{grid-column:1/2;color:var(--muted);font-size:10.5px;}
.pf-sub .late{color:#c0392b;font-weight:700;}
.pf-sub .ok{color:#3a9d4c;font-weight:700;}
.pf-track{position:relative;flex:1;background-image:repeating-linear-gradient(to right, var(--border) 0 1px, transparent 1px calc(100%/12));}
.pf-bar{position:absolute;top:50%;height:16px;margin-top:-8px;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.pf-bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0;}
.pf-bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0;}
.pf-fill{height:100%;background:var(--c);}
.pf-nodates{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;font-style:italic;}
.pf-today{position:absolute;top:0;bottom:0;width:2px;background:#c0392b;z-index:1;}
.pf-task-row{min-height:32px;background:rgba(0,0,0,.02);}
.pf-task-lbl{padding-left:24px;border-right:1px solid var(--border);}
.pf-task-name{font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.pf-bar-task{height:9px;margin-top:-4.5px;background:var(--c);}
.pf-single-marker{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;margin-left:-4.5px;border-radius:2px;background:var(--c);transform:rotate(45deg);}
.pf-subtask-block{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;margin-left:-7px;border-radius:4px;background:var(--surface);border:2.5px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.45);z-index:3;cursor:pointer;}
.pf-subtask-block:hover{transform:scale(1.18);}
.pf-subtask-block.done{background:var(--c);}
.pf-subtask-block.overdue{border-color:#c0392b;}
.pf-subtask-range{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:5px;background:var(--surface);border:2px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.4);z-index:3;cursor:pointer;}
.pf-subtask-range:hover{filter:brightness(1.1);}
.pf-subtask-range.done{background:var(--c);}
.pf-subtask-range.overdue{border-color:#c0392b;}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.pf-chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;color:var(--ink);}
.pf-chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, transparent);}
.pf-chip.clear{color:var(--muted);}
.pf-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.pf-col{flex:0 0 250px;background:var(--col-bg);border-radius:10px;padding:8px;min-height:100px;}
.pf-col.over{box-shadow:inset 0 0 0 2px var(--accent);}
.pf-col-head{font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;margin:2px 4px 8px;color:var(--ink);}
.pf-col-head .n{color:var(--muted);font-weight:400;}
.pf-card{background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);border-left:4px solid var(--c);cursor:grab;}
.pf-card.dragging{opacity:.4;}
.pf-card-proj{font-size:10.5px;color:var(--muted);}
.pf-card-title{font-weight:600;font-size:12.5px;margin:1px 0 4px;overflow-wrap:anywhere;}
.pf-card-meta{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--muted);}
.pf-card-meta .overdue{color:#c0392b;font-weight:700;}
.pf-subtasks{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:2px;}
.pf-subtask{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink);}
.pf-subtask.done .pf-subtask-text{text-decoration:line-through;color:var(--muted);}
.pf-subtask-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-subtask-date{color:var(--muted);white-space:nowrap;}
.pf-subtask-date.overdue{color:#c0392b;font-weight:700;}

.view{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

/* Kanban */
#board{flex:1;display:flex;align-items:flex-start;gap:12px;padding:14px;overflow:auto;height:100%;}
#board.stacked{flex-direction:column;overflow-x:hidden;}
#board.stacked .lane{flex:none;width:100%;max-height:none;}
#board.stacked .lane.collapsed{width:100%;flex:none;height:auto;}
#board.stacked .lane.collapsed .lane-header{flex-direction:row;height:auto;}
#board.stacked .lane.collapsed .lane-title{writing-mode:horizontal-tb;transform:none;margin:0;}
#board.stacked .lane-body{max-height:44vh;}
.lane{background:var(--col-bg);border-radius:12px;display:flex;flex-direction:column;flex:0 0 280px;max-height:100%;transition:flex-basis .15s;}
.lane.collapsed{flex:0 0 46px;width:46px;overflow:hidden;}
.lane-header{display:flex;align-items:center;gap:6px;padding:10px;background:var(--col-header);border-radius:12px 12px 0 0;cursor:pointer;user-select:none;}
.lane.collapsed .lane-header{flex-direction:column;border-radius:12px;height:100%;padding:10px 6px;}
.lane-color-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.lane-title{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lane.collapsed .lane-title{writing-mode:vertical-rl;transform:rotate(180deg);flex:1;margin:6px 0;}
.lane-count{background:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700;color:#444;}
.lane-collapse-btn{background:none;border:none;cursor:pointer;font-size:13px;color:#555;padding:2px 4px;}
.lane-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;min-height:40px;}
.lane-body.drag-over{background:rgba(79,124,255,.12);}
.lane-add-card{margin:0 8px 10px;border:1px dashed #b7bcc6;background:none;border-radius:8px;padding:6px;font-size:12px;color:#666;cursor:pointer;}
.card{border-radius:8px;padding:10px 10px 8px;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);font-size:12.5px;position:relative;font-family:'Segoe Print','Bradley Hand',cursive,'Segoe UI',sans-serif;border-left:4px solid transparent;}
.card.dragging{opacity:.4;}
.card::before{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%) rotate(-2deg);width:30px;height:12px;background:rgba(255,255,255,.45);border-radius:1px;}
.card-select-box{position:absolute;top:6px;left:6px;width:16px;height:16px;z-index:2;}
.card-delete-btn{position:absolute;top:4px;right:4px;background:rgba(255,255,255,.75);border:none;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:20px;text-align:center;cursor:pointer;color:#8a2a20;z-index:2;padding:0;}
.card-delete-btn:hover{background:#fff;color:#c0392b;}
.select-mode-card{padding-left:26px;}
.card-desc{font-weight:600;font-size:13.5px;min-height:18px;outline:none;word-break:break-word;margin-bottom:6px;}
.card-desc:focus{background:rgba(255,255,255,.5);border-radius:4px;}
.card-meta-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px;}
.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;}
.chip{background:rgba(255,255,255,.6);border-radius:999px;padding:1px 6px;font-size:10.5px;color:#333;text-decoration:none;}
.card input[type=date]{font-family:inherit;font-size:11px;border:none;background:rgba(255,255,255,.55);border-radius:5px;padding:2px 3px;cursor:pointer;color:#222;}
.deadline-row{display:flex;align-items:center;gap:4px;font-size:11px;color:#3a3a3a;}
.deadline-row.overdue{color:#b3261e;font-weight:700;}

/* Modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.overlay.hidden{display:none;}
.modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3);}
.modal h2{margin:0 0 14px;font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
.field textarea,.field input,.field select{width:100%;padding:7px 8px;border:1px solid #d7dae0;border-radius:7px;font-size:13px;font-family:inherit;}
.field textarea{min-height:60px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-footer{display:flex;justify-content:space-between;margin-top:16px;gap:8px;flex-wrap:wrap;}
.meta-readonly{font-size:11px;color:var(--muted);margin-top:10px;border-top:1px solid #eee;padding-top:8px;white-space:pre-line;}
.meta-readonly.scroll{max-height:80px;overflow-y:auto;}
.checklist-item{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #f0f0f0;}
.checklist-item-row1{display:flex;align-items:center;gap:6px;}
.checklist-item-row2{display:flex;align-items:center;gap:6px;margin-top:4px;padding-left:22px;flex-wrap:wrap;}
.checklist-item input[type=checkbox]{width:auto;flex:none;}
.checklist-item input[type=text]{flex:1;width:auto;min-width:90px;padding:5px 6px;font-size:12.5px;border:1px solid #ddd;border-radius:6px;}
.checklist-item input[type=date]{width:auto;flex:none;padding:4px 5px;font-size:11.5px;border:1px solid #ddd;border-radius:6px;}
.chk-period-toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;}
.chk-period-toggle input{width:auto;}
.chk-arrow{font-size:11px;color:var(--muted);}
.cbdd{position:relative;}
.cbdd-trigger{width:100%;text-align:left;padding:7px 8px;border:1px solid #d7dae0;border-radius:7px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.cbdd-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.cbdd-arrow{color:var(--muted);font-size:11px;flex:none;}
.cbdd-panel{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid #d7dae0;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:20;padding:6px;}
.cbdd-panel.hidden{display:none;}
.cbdd-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.cbdd-item{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;}
.cbdd-item:hover{background:#f2f4f8;}
.cbdd-item input{width:auto;flex:none;}
.cbdd-add{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid #eee;}
.cbdd-add input{flex:1;padding:5px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;}
.lane-config-row{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;flex-wrap:wrap;}
.lane-config-row input[type=text]{flex:1;min-width:70px;padding:5px 6px;border:1px solid #ddd;border-radius:6px;font-size:12px;}
.lane-config-row input[type=color]{width:30px;height:26px;border:none;padding:0;background:none;}
.lane-config-row select{font-size:11px;padding:3px 4px;border:1px solid #ddd;border-radius:6px;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;color:#666;padding:2px 5px;}
.warning-banner{background:#fff4e5;color:#8a5a00;border:1px solid #f3d19e;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99;}
.hidden{display:none !important;}
.tpl-row{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;}
.tpl-row span{flex:1;font-size:13px;}

/* Calendrier */
#calLabel{font-weight:600;font-size:14px;min-width:130px;text-align:center;}
#calendarGrid{flex:1;overflow-y:auto;padding:10px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;margin-bottom:4px;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{background:#fff;border-radius:8px;min-height:74px;padding:4px;font-size:11px;}
.cal-day.muted{background:transparent;color:#bbb;}
.cal-day.today{outline:2px solid var(--accent);}
.cal-day.drag-over{outline:2px dashed var(--accent);}
.cal-daynum{font-weight:600;font-size:11px;}
.cal-day-tasks{display:flex;flex-direction:column;gap:2px;margin-top:3px;}
.cal-task{color:#fff;border-radius:4px;padding:1px 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;}
.cal-task-ghost{cursor:pointer;font-weight:600;}
.cal-more{font-size:10px;color:var(--muted);}
.cal-week .cal-day{min-height:220px;}

/* Whiteboard */
.wb-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.wb-swatch.active{border-color:#333;}
.wb-tool.active{background:#dbe3f5;border-radius:8px;}
#wbCanvasWrap{flex:1;position:relative;background:#fff;overflow:auto;}
#wbZoomLayer{position:relative;transform-origin:0 0;}
#wbCanvas{position:absolute;top:0;left:0;touch-action:none;}
#wbOverlay{position:absolute;top:0;left:0;pointer-events:none;}
.wb-el{position:absolute;box-sizing:border-box;pointer-events:auto;}
.wb-el.selected{outline:2px dashed #4f7cff;outline-offset:2px;}
.wb-shape-inner{width:100%;height:100%;box-sizing:border-box;background:transparent;pointer-events:none;}
.wb-el[data-type="text"],.wb-el[data-type="sticky"]{display:flex;flex-direction:column;}
.wb-draghandle{height:12px;flex:none;background:rgba(0,0,0,.08);border-radius:4px 4px 0 0;cursor:move;font-size:9px;text-align:center;line-height:12px;color:#777;user-select:none;}
.wb-content{flex:1;min-height:0;width:100%;box-sizing:border-box;outline:none;overflow:auto;font-size:13px;padding:4px;cursor:text;background:transparent;}
.wb-sticky-content{padding:8px;box-shadow:0 3px 8px rgba(0,0,0,.18);border-radius:0 0 4px 4px;font-family:'Segoe Print','Bradley Hand',cursive,'Segoe UI',sans-serif;}
.wb-del,.wb-resize{position:absolute;display:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:11px;cursor:pointer;z-index:5;}
.wb-el.selected .wb-del,.wb-el.selected .wb-resize{display:flex;}
.wb-del{top:-9px;right:-9px;color:#c0392b;}
.wb-resize{bottom:-9px;right:-9px;cursor:nwse-resize;color:#555;}
.wb-resize::after{content:'⤡';}
#wbZoomLabel{font-size:11.5px;min-width:38px;text-align:center;}

/* Tableau de bord */
#dashboardGrid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-content:start;}
.dash-module{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.dash-module h3{margin:0 0 10px;font-size:13px;color:#444;}
.dash-module.full{grid-column:1/-1;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;}
.kpi-card{background:#f7f8fa;border-radius:10px;padding:10px;text-align:center;}
.kpi-value{font-size:22px;font-weight:800;}
.kpi-label{font-size:10.5px;color:var(--muted);margin-top:2px;}
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.donut-legend{font-size:11.5px;display:flex;flex-direction:column;gap:4px;}
.donut-legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
.bar-row{margin-bottom:6px;}
.bar-track{background:#eee;border-radius:6px;overflow:hidden;height:10px;}
.bar-fill{height:100%;}
.dash-config-row{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;}
.cm-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0;}
.cm-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0;}
.cm-value{font-size:11px;font-weight:700;margin-bottom:3px;color:var(--ink);}
.cm-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;}
.cm-label{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;}
.cm-label.current{color:#c0392b;font-weight:700;}
.cm-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--muted);}
.cm-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.sp-card{border:2px solid;border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;}
.sp-title{font-weight:700;font-size:12.5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sp-sub{font-size:11px;color:var(--muted);margin-bottom:8px;}
.sp-bar{display:flex;height:20px;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.06);position:relative;}
.sp-seg{flex:1;border-right:1px solid rgba(0,0,0,.15);}
.sp-seg:last-child{border-right:none;}
.sp-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e05a7a;}

/* Jalons clés & points d'attention */
.jal-wrap{background:#1b2233;border-radius:12px;padding:18px 16px 14px;color:#e8ecf5;}
.jal-title{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:#9fb0d9;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.jal-timeline{position:relative;height:64px;margin:0 6px 6px;}
.jal-axis{position:absolute;left:0;right:0;top:32px;height:2px;background:#333f5c;border-radius:2px;}
.jal-empty{font-size:12px;color:#7c8bb0;padding:10px 2px 4px;}
.jal-marker{position:absolute;top:32px;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:2.5px solid #1b2233;box-shadow:0 0 0 2px currentColor;cursor:pointer;z-index:2;}
.jal-marker:hover{transform:translate(-50%,-50%) scale(1.25);}
.jal-marker.past{opacity:.55;}
.jal-tag{position:absolute;top:-40px;transform:translateX(-50%);min-width:64px;max-width:120px;text-align:center;font-size:10px;line-height:1.25;pointer-events:none;}
.jal-tag .jal-month{display:block;font-weight:800;color:#cfd8ee;font-size:10.5px;}
.jal-tag .jal-desc{display:block;color:#8fa0c9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.jal-tag.below{top:40px;}
.jal-months{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:space-between;font-size:9.5px;color:#5c6b91;pointer-events:none;}
.jal-attn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px;}
.jal-card{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.4;position:relative;background:rgba(255,255,255,.06);border-left:4px solid;}
.jal-card.warn{border-color:#e0625f;} .jal-card.info{border-color:#4f9eff;} .jal-card.ok{border-color:#3ad19a;} .jal-card.manual{border-color:#e8a34d;}
.jal-card-head{display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px;margin-bottom:3px;color:#cfd8ee;}
.jal-card-body{color:#aab6d6;outline:none;min-height:16px;}
.jal-card-body:focus{background:rgba(255,255,255,.08);border-radius:4px;}
.jal-card-del{position:absolute;top:6px;right:7px;background:none;border:none;color:#7c8bb0;cursor:pointer;font-size:11px;padding:2px 4px;}
.jal-card-del:hover{color:#e0625f;}
.jal-add-card{border:1.5px dashed #3a4568;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#7c8bb0;font-size:12px;cursor:pointer;min-height:52px;}
.jal-add-card:hover{color:#cfd8ee;border-color:#5c6b91;}

@media print{
  #toolbar,.sub-toolbar,#confetti-canvas{display:none !important;}
  #app,.view{overflow:visible !important;height:auto !important;}
  #dashboardGrid{display:block !important;}
  .dash-module{page-break-inside:avoid;margin-bottom:14px;box-shadow:none;border:1px solid #ddd;}
  body{overflow:visible !important;}
}
</style>
</head>

  <div id="toolbar">
    <h1>🗂️ Gestion de Projet</h1>
    <div id="tabBar" role="tablist">
      <button class="tab-btn" data-tab="dashboard" role="tab">📊 Tableau de bord</button>

      <button class="tab-btn" data-tab="whiteboard" role="tab">🖌️ Whiteboard</button>
    </div>
    <span id="syncIndicator" class="hidden">⏳ Sync…</span>
    <div id="alertsWrap" style="position:relative;">
      <button class="icon-btn" id="btnAlerts" title="Rappels" aria-label="Rappels">🔔<span id="alertsBadge" class="alerts-badge hidden"></span></button>
      <div id="alertsPanel" class="alerts-panel hidden"></div>
    </div>
    <button class="icon-btn" id="btnThemeToggle" title="Basculer mode sombre/clair" aria-label="Basculer mode sombre/clair">🌙</button>
    <button class="icon-btn" id="btnGlobalExportCsv" title="Exporter en CSV" aria-label="Exporter en CSV">⬇️</button>
  </div>
  <div id="globalStats" class="sub-toolbar"></div>

  <!-- Onglet Tableau de bord -->
  <div id="view-dashboard" class="view hidden">
    <div class="sub-toolbar">
      <button class="btn secondary" id="btnDashExport">⬇️ Export CSV</button>
      <button class="btn secondary" id="btnDashPrint">🖨️ Imprimer / PDF</button>
      <button class="btn secondary" id="btnDashConfig">⚙️ Personnaliser</button>
    </div>
    <div id="dashboardGrid"></div>
  </div>

  <div id="view-kanban" class="view">
    <div class="sub-toolbar">
      <input type="search" id="fSearch" placeholder="🔍 Rechercher…" aria-label="Rechercher une tâche">
      <select id="fAssignee" aria-label="Filtrer par assigné"><option value="">Assigné à : tous</option></select>
      <select id="fPriorite" aria-label="Filtrer par priorité"><option value="">Priorité : toutes</option></select>
      <select id="fType" aria-label="Filtrer par type"><option value="">Type : tous</option></select>
      <select id="fSortBy" aria-label="Trier par"><option value="default">Trier : Par défaut</option><option value="priorite">Trier : Priorité</option><option value="deadline">Trier : Deadline</option></select>
      <select id="fGroupBy" aria-label="Grouper par"><option value="statut">Grouper : Statut</option><option value="priorite">Grouper : Priorité</option><option value="type">Grouper : Type</option></select>
      <button class="btn secondary" id="btnToggleView" title="Basculer vue colonnes / liste">📱</button>
      <button class="btn secondary" id="btnSelectMode" title="Sélection multiple">☑️</button>
      <button class="btn secondary" id="btnTemplates" title="Modèles de tâches">📑 Modèles</button>
      <button class="btn secondary" id="btnExportCsv">⬇️ Export CSV</button>
      <button class="btn secondary" id="btnSettings">⚙️ Colonnes</button>
      <button class="btn" id="btnNewCard">+ Nouvelle tâche</button>
    </div>
    <div id="bulkBar" class="sub-toolbar hidden">
      <span id="bulkCount"></span>
      <select id="bulkMoveTo"><option value="">Déplacer vers…</option></select>
      <button class="btn danger" id="bulkDelete">🗑️ Supprimer la sélection</button>
      <button class="btn secondary" id="bulkCancel">Annuler</button>
    </div>
    <div id="board"></div>
  </div>

  <!-- Onglet Portefeuille projets : frise glissante 12 mois + Kanban fusionné filtrable -->
  <div id="view-table" class="view hidden">
    <div class="sub-toolbar">
      <span id="pfSummary" style="font-size:12px;color:var(--muted);margin-right:auto;"></span>
      <button class="icon-btn" id="pfPrev" aria-label="Mois précédent">◀</button>
      <span id="pfRange" style="font-size:12.5px;font-weight:600;min-width:150px;text-align:center;"></span>
      <button class="icon-btn" id="pfNext" aria-label="Mois suivant">▶</button>
      <button class="btn secondary" id="pfToday">Aujourd'hui</button>
    </div>
    <div id="pfMain" style="flex:1;overflow:auto;"></div>
  </div>

  <!-- Onglet Calendrier -->
  <div id="view-calendar" class="view hidden">
    <div class="sub-toolbar">
      <button class="icon-btn" id="calPrev" aria-label="Mois/semaine précédent">◀</button>
      <span id="calLabel"></span>
      <button class="icon-btn" id="calNext" aria-label="Mois/semaine suivant">▶</button>
      <button class="btn secondary" id="calToday">Aujourd'hui</button>
      <button class="btn secondary" id="calViewToggle">Vue : Mois</button>
    </div>
    <div id="calendarGrid"></div>
  </div>

  <!-- Onglet Whiteboard -->
  <div id="view-whiteboard" class="view hidden">
    <div class="sub-toolbar" id="wbToolbar">
      <button class="icon-btn wb-tool active" data-wb-tool="pen" title="Stylo">✏️</button>
      <button class="icon-btn wb-tool" data-wb-tool="eraser" title="Gomme">🧹</button>
      <button class="icon-btn wb-tool" data-wb-tool="rect" title="Rectangle">⬜</button>
      <button class="icon-btn wb-tool" data-wb-tool="ellipse" title="Ellipse">⚪</button>
      <button class="icon-btn wb-tool" data-wb-tool="arrow" title="Flèche">➡️</button>
      <button class="icon-btn wb-tool" data-wb-tool="text" title="Texte">🔤</button>
      <button class="icon-btn wb-tool" data-wb-tool="sticky" title="Post-it">🗒️</button>
      <button class="icon-btn wb-tool" data-wb-tool="select" title="Sélectionner / déplacer">🖱️</button>
      <span style="width:1px;height:20px;background:#ddd;"></span>
      <button class="wb-swatch active" data-wb-color="#222222" style="background:#222222" title="Noir"></button>
      <button class="wb-swatch" data-wb-color="#e63946" style="background:#e63946" title="Rouge"></button>
      <button class="wb-swatch" data-wb-color="#2a9d8f" style="background:#2a9d8f" title="Vert"></button>
      <button class="wb-swatch" data-wb-color="#4f7cff" style="background:#4f7cff" title="Bleu"></button>
      <button class="wb-swatch" data-wb-color="#f4a300" style="background:#f4a300" title="Orange"></button>
      <label style="font-size:11.5px;display:flex;align-items:center;gap:4px;">Épaisseur <input type="range" id="wbSize" min="1" max="24" value="3"></label>
      <button class="icon-btn" id="wbZoomOut" title="Zoom arrière">➖</button>
      <span id="wbZoomLabel">100%</span>
      <button class="icon-btn" id="wbZoomIn" title="Zoom avant">➕</button>

    <div id="wbCanvasWrap"><div id="wbZoomLayer"><canvas id="wbCanvas"></canvas><div id="wbOverlay"></div></div></div>

</div>

<div class="overlay hidden" id="taskOverlay"><div class="modal" id="taskModal" role="dialog" aria-modal="true"></div></div>
<div class="overlay hidden" id="settingsOverlay"><div class="modal" id="settingsModal" role="dialog" aria-modal="true"></div></div>
<div class="overlay hidden" id="dashConfigOverlay"><div class="modal" id="dashConfigModal" role="dialog" aria-modal="true"></div></div>
<div class="overlay hidden" id="templatesOverlay"><div class="modal" id="templatesModal" role="dialog" aria-modal="true"></div></div>
<div class="overlay hidden" id="subtaskOverlay"><div class="modal" id="subtaskModal" role="dialog" aria-modal="true"></div></div>
<canvas id="confetti-canvas"></canvas>

<script>
/* ===== CONFIG (données statiques) ===== */
const REQUIRED_COLUMNS = [
  { name:"Description", type:"Text" },
  { name:"Priorite", title:"Priorité", type:"Choice" },
  { name:"Deadline", type:"DateTime", optional:true },
  { name:"Statut", type:"Choice" },
  { name:"AssigneA", title:"Assigné à", type:"ChoiceList", optional:true },
  { name:"Type", type:"Choice", optional:true },
  { name:"Notes", type:"Text", optional:true },
  { name:"Responsable", type:"ChoiceList", optional:true },
  { name:"CreeLe", title:"Créé le", type:"DateTime", optional:true },
  { name:"DerniereMaj", title:"Dernière mise à jour", type:"DateTime", optional:true },
  { name:"Historique", title:"Historique des changements", type:"Text", optional:true },
  { name:"Ordre", title:"Ordre (tri manuel)", type:"Numeric", optional:true },
  { name:"Checklist", title:"Sous-tâches (JSON)", type:"Text", optional:true },
  { name:"Recurrence", title:"Récurrence", type:"Choice", optional:true },
  { name:"DateDebut", title:"Date de début", type:"Date", optional:true },
  { name:"Couleur", title:"Couleur (frise)", type:"Text", optional:true },
  { name:"JalonCle", title:"Jalon clé", type:"Bool", optional:true },
];
const PRIORITY_COLORS = {
  Urgent:{bg:"#ffd3d3",badge:"#c0392b"}, Haute:{bg:"#ffe3bd",badge:"#d9822b"},
  Moyenne:{bg:"#fff6b8",badge:"#c9a400"}, Basse:{bg:"#d9f5d6",badge:"#3a9d4c"},
  __default:{bg:"#f3f0e6",badge:"#8a8a8a"},
};
const RECURRENCE_LABELS = { none:"Aucune", daily:"Quotidienne", weekly:"Hebdomadaire", monthly:"Mensuelle" };
// Effets déclenchables quand une tâche arrive dans une colonne. "confetti" a un rendu
// dédié (canvas) ; "custom" utilise un émoji libre (lane.customEmoji) ; les autres sont
// des émojis prédéfinis animés (voir launchEmojiBurst).
const EFFECTS = {
  none:     { label: "Aucun" },
  confetti: { label: "🎉 Confettis" },
  clap:     { label: "👏🏾 Applaudissements", emoji: "👏🏾" },
  boom:     { label: "💥 Boom", emoji: "💥" },
  sparkles: { label: "✨ Étincelles", emoji: "✨" },
  party:    { label: "🥳 Fête", emoji: "🥳" },
  fire:     { label: "🔥 Feu", emoji: "🔥" },
  rocket:   { label: "🚀 Fusée", emoji: "🚀" },
  custom:   { label: "🖊️ Personnalisé…" },
};
const cid = () => "c" + Math.random().toString(36).slice(2, 9);
const defaultColumnsConfig = () => [
  { id:cid(), label:"À faire",    statut:"À faire",    color:"#8a8f98", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"todo" },
  { id:cid(), label:"En cours",   statut:"En cours",   color:"#4f7cff", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"doing" },
  { id:cid(), label:"En attente", statut:"En attente", color:"#d9822b", sortByDeadline:true,  effect:"none",     collapsedByDefault:false, dashCategory:"todo" },
  { id:cid(), label:"Terminé",    statut:"Terminé",    color:"#3a9d4c", sortByDeadline:false, effect:"confetti", collapsedByDefault:false, dashCategory:"done" },
  { id:cid(), label:"Annulé",     statut:"Annulé",     color:"#b3261e", sortByDeadline:false, effect:"none",     collapsedByDefault:true,  dashCategory:"cancelled" },
];
// Compatibilité avec les configs déjà enregistrées (ancien champ booléen `confetti`, absence de `dashCategory`)
const normalizeColumnsConfig = cfg => cfg.map(l => ({
  ...l,
  effect: l.effect ?? (l.confetti ? "confetti" : "none"),
  dashCategory: l.dashCategory ?? "todo",
}));
const DASHBOARD_MODULES = {
  kpis:              { label: "Indicateurs clés" },
  donutStatut:       { label: "Répartition par statut" },
  barsPriorite:      { label: "Répartition par priorité" },
  teamLoad:          { label: "Charge de l'équipe" },
  evolution:         { label: "Évolution (8 semaines)", full:true },
  chargeParMois:     { label: "Analyse & synthèse — Charge par mois", full:true },
  syntheseParProjet: { label: "Synthèse par projet", full:true },
  deadlines:         { label: "Échéances", full:true },
  jalonsAttention:   { label: "Jalons clés & points d'attention", full:true },
};
const defaultDashboardLayout = () => Object.keys(DASHBOARD_MODULES).map(id => ({ id, visible:true }));
const defaultTaskTemplates = () => [];

/* ===== DOMAINE (logique pure, aucune dépendance DOM/Grist) ===== */
const gristDateToJS = v => v == null || v === "" ? null : (typeof v === "number" ? new Date(v*1000) : (isNaN(new Date(v)) ? null : new Date(v)));
const jsDateToGristEpoch = s => s ? Math.floor(new Date(s+"T00:00:00Z").getTime()/1000) : null;
const nowEpoch = () => Math.floor(Date.now()/1000);
const fmtDate = d => d ? d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
const fmtDateTime = d => d ? d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const toDateInputValue = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : "";
const decodeChoiceList = v => Array.isArray(v) ? (v[0]==="L" ? v.slice(1) : v) : (typeof v==="string" && v ? v.split(",").map(s=>s.trim()).filter(Boolean) : []);
const encodeChoiceList = arr => ["L", ...arr];
const priorityStyle = p => PRIORITY_COLORS[p] || PRIORITY_COLORS.__default;
const seededRotation = id => {
  const n = typeof id==="number" ? id : String(id).split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  return ((n % 9) - 4) * 0.5;
};
const parseChecklist = raw => { try{ const a = JSON.parse(raw||"[]"); return Array.isArray(a) ? a : []; }catch{ return []; } };
const checklistProgress = raw => { const items = parseChecklist(raw); return items.length ? { done: items.filter(i=>i.done).length, total: items.length } : null; };
function addInterval(date, recurrence){
  const d = new Date(date);
  if (recurrence === "daily") d.setDate(d.getDate()+1);
  else if (recurrence === "weekly") d.setDate(d.getDate()+7);
  else if (recurrence === "monthly") d.setMonth(d.getMonth()+1);
  return d;
}
// Regroupement dynamique du Kanban : par défaut les colonnes = vos Statuts configurés
// (⚙️ Colonnes), mais on peut aussi regrouper à la volée par Priorité ou par Type.
// laneMatchesTask/laneAssignFields abstraient cette différence pour le reste du code.
const GROUP_PALETTE = ["#4f7cff","#e07856","#3a9d4c","#a05fd1","#c9a400","#2aa9a0","#c0567a","#6c7a89"];
function getActiveLanes(){
  if (!state.groupBy || state.groupBy === "statut") return state.columnsConfig || [];
  const field = state.groupBy === "priorite" ? "Priorite" : "Type";
  const values = new Set();
  filteredRecords().forEach(r => values.add(r[field] || "(Aucun)"));
  let ordered;
  if (field === "Priorite"){
    const order = ["Urgent","Haute","Moyenne","Basse","(Aucun)"];
    ordered = order.filter(v => values.has(v));
  } else {
    ordered = [...values].sort((a,b) => a==="(Aucun)" ? 1 : (b==="(Aucun)" ? -1 : a.localeCompare(b,"fr")));
  }
  return ordered.map((v,i) => ({
    id: `grp__${field}__${v}`, label: v, groupField: field, groupValue: v,
    color: field==="Priorite" ? priorityStyle(v==="(Aucun)"?"":v).badge : GROUP_PALETTE[i%GROUP_PALETTE.length],
    sortByDeadline:false, effect:"none",
  }));
}
function laneMatchesTask(lane, t){
  if (lane.groupField) return (t[lane.groupField] || "(Aucun)") === lane.groupValue;
  return (t.Statut||"") === lane.statut;
}
function laneAssignFields(lane){
  if (lane.groupField) return { [lane.groupField]: lane.groupValue === "(Aucun)" ? "" : lane.groupValue };
  return { Statut: lane.statut };
}
// Règle métier : tri par deadline sur les colonnes actives ; sur les colonnes non
// triées par deadline, on respecte l'ordre manuel (glisser-déposer) dès qu'il existe,
// sinon on retombe sur un tri par dernière mise à jour décroissante. Le sélecteur
// "Trier par" (state.sortBy) permet de forcer un tri global (Priorité/Deadline).
function tasksForLane(records, lane){
  const list = records.filter(r => laneMatchesTask(lane, r));
  if (state.sortBy === "priorite"){
    const order = ["Urgent","Haute","Moyenne","Basse"];
    list.sort((a,b) => order.indexOf(a.Priorite) - order.indexOf(b.Priorite));
    return list;
  }
  const effectiveSortByDeadline = state.sortBy === "deadline" ? true : lane.sortByDeadline;
  if (effectiveSortByDeadline){
    list.sort((a,b) => (gristDateToJS(a.Deadline) ?? Infinity) - (gristDateToJS(b.Deadline) ?? Infinity));
  } else if (list.some(r => r.Ordre != null)){
    list.sort((a,b) => (a.Ordre ?? Infinity) - (b.Ordre ?? Infinity));
  } else {
    list.sort((a,b) => (gristDateToJS(b.DerniereMaj)||0) - (gristDateToJS(a.DerniereMaj)||0));
  }
  return list;
}

/* ===== INFRASTRUCTURE (seules fonctions qui touchent `grist`/`localStorage`) ===== */
let gristAvailable = true;
let colMappings = null; // { NomLogique: "vrai_id_colonne_grist", ... }

function initGrist({ onRecordsChange, onOptionsChange, onUnavailable }){
  try{
    grist.ready({ columns: REQUIRED_COLUMNS, allowSelectBy: true, requiredAccess: "full" });
    grist.onRecords((records, mappings) => {
      colMappings = mappings;
      onRecordsChange(records.map(r => ({ ...grist.mapColumnNames(r, mappings), id: r.id })));
    });
    grist.onOptions(options => onOptionsChange(options || {}));
  }catch(e){
    gristAvailable = false;
    console.warn("Grist indisponible, mode démo local.", e);
    onUnavailable?.(e);
  }
}
// Traduit { NomLogique: valeur } -> { vrai_id_colonne: valeur } grâce aux mappings
// fournis par Grist. Une colonne optionnelle non mappée par l'utilisateur est
// simplement omise (au lieu d'envoyer un identifiant invalide côté Grist).
function toRealFields(fields){
  if (!colMappings) return fields;
  const out = {};
  for (const [key, value] of Object.entries(fields)){
    const realKey = colMappings[key];
    if (realKey) out[realKey] = value;
  }
  return out;
}
async function updateTaskFields(rowId, fields){
  const payload = { ...fields, DerniereMaj: nowEpoch() };
  if (!gristAvailable) throw new Error("Grist indisponible");
  await grist.selectedTable.update({ id: rowId, fields: toRealFields(payload) });
}
async function createTask(fields){
  if (!gristAvailable) throw new Error("Grist indisponible");
  return grist.selectedTable.create({ fields: toRealFields(fields) });
}
async function deleteTask(rowId){
  if (!gristAvailable) throw new Error("Grist indisponible");
  await grist.selectedTable.destroy(rowId);
}

}

// Point d'écriture générique : factorise essai/erreur/toast/indicateur de synchronisation.
let pendingWrites = 0;

function launchConfetti(x, y){
  const canvas = document.getElementById("confetti-canvas");
  canvas.width = innerWidth; canvas.height = innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93"];
  const LIFE = 300;
  const particles = Array.from({length:90}, () => ({
    x, y, vx:(Math.random()-.5)*4, vy:Math.random()*-6-3, size:Math.random()*6+4,
    color: colors[Math.random()*colors.length|0], rot:Math.random()*360, vr:(Math.random()-.5)*6, life:0,
  }));
  (function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    for (const p of particles){
      p.vy += .05; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      if (p.life < LIFE){
        alive = true;
        const fade = p.life > LIFE-50 ? (LIFE-p.life)/50 : 1;
        ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); ctx.restore();
      }
    }
    if (alive) requestAnimationFrame(step); else ctx.clearRect(0,0,canvas.width,canvas.height);
  })();
}
function launchEmojiBurst(emoji, x, y){
  for (let i = 0; i < 16; i++){
    const el = document.createElement("div");
    el.textContent = emoji;
    el.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-size:${18+Math.random()*18}px;pointer-events:none;z-index:100;`;
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2, dist = 70+Math.random()*160;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist - 60;
    const rot = (Math.random()-.5)*180;
    const duration = 4500+Math.random()*1000;
    const anim = el.animate([
      { transform:"translate(0,0) rotate(0deg) scale(.6)", opacity:1, offset:0 },
      { transform:`translate(${dx*.6}px,${dy*.6}px) rotate(${rot*.6}deg) scale(1)`, opacity:1, offset:.6 },
      { transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(1.15)`, opacity:0, offset:1 },
    ], { duration, easing:"ease-out", fill:"forwards" });
    anim.onfinish = () => el.remove();
  }
}
function launchEffect(lane, x, y){
  const effect = lane?.effect;
  if (!effect || effect === "none") return;
  if (effect === "confetti") return launchConfetti(x, y);
  if (effect === "custom") return lane.customEmoji && launchEmojiBurst(lane.customEmoji, x, y);
  const def = EFFECTS[effect];
  if (def?.emoji) launchEmojiBurst(def.emoji, x, y);
}

/* -- Récurrence : recrée automatiquement une tâche quand l'originale est terminée -- */
async function maybeSpawnRecurrence(sourceTask, newCategory){
  if (newCategory !== "done" || !sourceTask.Recurrence || sourceTask.Recurrence === "none") return;
  const firstLane = state.columnsConfig?.[0];
  if (!firstLane) return;
  const baseDate = gristDateToJS(sourceTask.Deadline) || new Date();
  const nextDeadline = addInterval(baseDate, sourceTask.Recurrence);
  const fields = {
    Description: sourceTask.Description, Priorite: sourceTask.Priorite, Type: sourceTask.Type,
    Notes: sourceTask.Notes, Recurrence: sourceTask.Recurrence,
    Statut: firstLane.statut, Deadline: jsDateToGristEpoch(toDateInputValue(nextDeadline)),
    CreeLe: nowEpoch(), DerniereMaj: nowEpoch(),
  };
  const tempId = -Date.now();
  state.records.push({ id: tempId, ...fields });
  notify();
  const result = await writeToGrist(() => createTask(fields), "Tâche récurrente non recréée dans Grist.");
  const realId = result?.id ?? (Array.isArray(result) ? result[0]?.id : undefined);
  if (realId){ const rec = state.records.find(r => r.id === tempId); if (rec) rec.id = realId; }
}

const csvEscape = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function csvValue(r, col){
  if (["AssigneA","Responsable"].includes(col)) return decodeChoiceList(r[col]).join("; ");
  if (["Deadline","CreeLe","DerniereMaj"].includes(col)) return fmtDate(gristDateToJS(r[col]));
  return r[col] ?? "";
}
function exportCsv(){
  const cols = ["Description","Priorite","Statut","Deadline","AssigneA","Type","Responsable","CreeLe","DerniereMaj","Notes"];
  const rows = filteredRecords();
  const csv = [cols.join(","), ...rows.map(r => cols.map(c => csvEscape(csvValue(r,c))).join(","))].join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `kanban-export-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

const descSaveTimers = new Map();
function flushDescriptionSave(id, val){
  clearTimeout(descSaveTimers.get(id));
  descSaveTimers.delete(id);
  writeToGrist(() => updateTaskFields(id, { Description: val }), "Description non enregistrée dans Grist.");
  patchRecordLocally(id, { Description: val });
}
function scheduleDescriptionSave(id, val){
  clearTimeout(descSaveTimers.get(id));
  descSaveTimers.set(id, setTimeout(() => flushDescriptionSave(id, val), 500));
}

function getDragAfterElement(container, y){
  const cards = [...container.querySelectorAll(".card:not(.dragging)")];
  return cards.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    return (offset < 0 && offset > closest.offset) ? { offset, element: child } : closest;
  }, { offset: -Infinity, element: null }).element;
}

let dragFromLaneId = null;
function initBoardEvents(){
  const board = document.getElementById("board");

  board.addEventListener("click", e => {
    const toggle = e.target.closest("[data-toggle]");
    if (toggle){ const id = toggle.dataset.toggle; state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id); return notify(); }
    const addBtn = e.target.closest("[data-add-lane]");
    if (addBtn) return handleAddCard(addBtn.dataset.addLane);
    const delBtn = e.target.closest("[data-delete-task]");
    if (delBtn) return armDoubleClickConfirm(delBtn, () => confirmDeleteTask(Number(delBtn.dataset.deleteTask)), "✅");
    const card = e.target.closest(".card");
    if (selectMode && card){
      const id = Number(card.dataset.id);
      selectedTaskIds.has(id) ? selectedTaskIds.delete(id) : selectedTaskIds.add(id);
      renderBoard();
      return;
    }
    if (e.target.closest("[data-field]")) return;
    if (card) openTaskModal(Number(card.dataset.id));
  });
  board.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("card")){
      e.preventDefault();
      if (!selectMode) openTaskModal(Number(e.target.dataset.id));
    }
  });

  board.addEventListener("input", e => {
    const el = e.target.closest('[data-field="Description"]');
    if (el) scheduleDescriptionSave(Number(el.dataset.id), el.textContent.trim());
  });
  board.addEventListener("focusout", e => {
    const el = e.target.closest('[data-field="Description"]');
    if (el) flushDescriptionSave(Number(el.dataset.id), el.textContent.trim());
  });
  board.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest('[data-field="Description"]')){ e.preventDefault(); e.target.blur(); }
  });

  board.addEventListener("change", e => {
    const el = e.target.closest('input[data-field="Deadline"]');
    if (!el) return;
    const id = Number(el.dataset.id), epoch = jsDateToGristEpoch(el.value);
    writeToGrist(() => updateTaskFields(id, { Deadline: epoch }), "Deadline non enregistrée dans Grist.");
    patchRecordLocally(id, { Deadline: epoch });
    notify();
  });

  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    card.classList.add("dragging");
    dragFromLaneId = card.closest(".lane")?.dataset.laneId || null;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
  });
  board.addEventListener("dragend", e => { e.target.closest(".card")?.classList.remove("dragging"); dragFromLaneId = null; });
  board.addEventListener("dragover", e => {
    const zone = e.target.closest("[data-drop-lane]");
    if (!zone) return;
    e.preventDefault();
    zone.classList.add("drag-over");
    if (zone.dataset.dropLane === dragFromLaneId){
      const dragging = document.querySelector(".card.dragging");
      if (dragging){
        const after = getDragAfterElement(zone, e.clientY);
        after ? zone.insertBefore(dragging, after) : zone.appendChild(dragging);
      }
    }
  });
  board.addEventListener("dragleave", e => e.target.closest("[data-drop-lane]")?.classList.remove("drag-over"));
  board.addEventListener("drop", e => {
    const zone = e.target.closest("[data-drop-lane]");
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove("drag-over");
    const id = Number(e.dataTransfer.getData("text/plain"));
    const lane = getActiveLanes().find(l => l.id === zone.dataset.dropLane);
    const rec = state.records.find(r => r.id === id);
    if (!lane || !rec){ dragFromLaneId = null; return; }
    const sameLane = zone.dataset.dropLane === dragFromLaneId;
    const wasDifferent = !laneMatchesTask(lane, rec);
    const prevFields = { Statut: rec.Statut, Ordre: rec.Ordre, Historique: rec.Historique };

    if (sameLane){
      [...zone.querySelectorAll(".card")].forEach((cardEl, i) => {
        const cardId = Number(cardEl.dataset.id);
        const r = state.records.find(x => x.id === cardId);
        const newOrder = (i+1)*10;
        if (r && r.Ordre !== newOrder){
          r.Ordre = newOrder;
          writeToGrist(() => updateTaskFields(cardId, { Ordre: newOrder }), "Ordre non enregistré dans Grist.");
        }
      });
    } else if (lane.groupField){
      const maxOrder = state.records.filter(r => laneMatchesTask(lane, r)).reduce((m,r) => Math.max(m, r.Ordre||0), 0);
      const fields = { ...laneAssignFields(lane), Ordre: maxOrder+10 };
      writeToGrist(() => updateTaskFields(id, fields), "Déplacement non enregistré dans Grist.");
      Object.assign(rec, fields);
    } else {
      const maxOrder = state.records.filter(r => r.Statut === lane.statut).reduce((m,r) => Math.max(m, r.Ordre||0), 0);
      const histLine = `${fmtDateTime(new Date())} : ${rec.Statut || "—"} → ${lane.statut}`;
      const fields = { Statut: lane.statut, Ordre: maxOrder+10, Historique: (rec.Historique ? rec.Historique+"\n" : "")+histLine };
      writeToGrist(() => updateTaskFields(id, fields), "Déplacement non enregistré dans Grist.");
      Object.assign(rec, fields);
      pushUndo(() => {
        writeToGrist(() => updateTaskFields(id, prevFields), "Annulation non enregistrée dans Grist.");
        patchRecordLocally(id, prevFields);
        notify();
      });
      maybeSpawnRecurrence(rec, lane.dashCategory);
    }
    notify();
    if (wasDifferent && !lane.groupField) launchEffect(lane, innerWidth/2, innerHeight/2);
    dragFromLaneId = null;
  });
}

/* -- Sélection multiple : barre d'actions groupées -- */
function initBulkBar(){
  document.getElementById("btnSelectMode").onclick = toggleSelectMode;
  document.getElementById("board").addEventListener("change", e => {
    const chk = e.target.closest("[data-select-task]");
    if (!chk) return;
    const id = Number(chk.dataset.selectTask);
    chk.checked ? selectedTaskIds.add(id) : selectedTaskIds.delete(id);
    updateBulkBar();
  });
  document.getElementById("bulkCancel").onclick = () => { selectMode = false; selectedTaskIds.clear(); document.getElementById("btnSelectMode").classList.remove("active"); renderBoard(); };
  document.getElementById("bulkDelete").onclick = e => armDoubleClickConfirm(e.currentTarget, async () => {
    for (const id of selectedTaskIds) await writeToGrist(() => deleteTask(id), "Suppression non enregistrée dans Grist.");
    state.records = state.records.filter(r => !selectedTaskIds.has(r.id));
    selectedTaskIds.clear();
    notify();
  }, "✅ Confirmer ?");
  document.getElementById("bulkMoveTo").addEventListener("change", e => {
    const laneId = e.target.value;
    if (!laneId) return;
    const lane = state.columnsConfig.find(l => l.id === laneId);
    if (!lane) return;
    selectedTaskIds.forEach(id => {
      const rec = state.records.find(r => r.id === id);
      if (!rec) return;
      writeToGrist(() => updateTaskFields(id, { Statut: lane.statut }), "Déplacement non enregistré dans Grist.");
      rec.Statut = lane.statut;
      maybeSpawnRecurrence(rec, lane.dashCategory);
    });
    selectedTaskIds.clear();
    e.target.value = "";
    notify();
  });
}

/* -- Popup détail tâche (utilisée depuis Kanban, Calendrier et Tableau de bord) -- */
let modalChecklist = [];
let modalColorAuto = true;
let modalMultiSelects = {};
function checklistItemsHtml(items){
  return `<div id="checklist-items">${items.map((it,i) => {
    const isRange = !!it.dateEnd;
    return `
    <div class="checklist-item" data-idx="${i}">
      <div class="checklist-item-row1">
        <input type="checkbox" data-chk="done" ${it.done?"checked":""}>
        <input type="text" data-chk="text" value="${escapeHtml(it.text||"")}" placeholder="Sous-tâche…">
        <button type="button" class="icon-btn" data-chk="del">✕</button>
      </div>
      <div class="checklist-item-row2">
        <label class="chk-period-toggle"><input type="checkbox" data-chk="period-toggle" ${isRange?"checked":""}> Période</label>
        <input type="date" data-chk="date" value="${it.date||""}" title="${isRange?"Date de début":"Date"}">
        ${isRange ? `<span class="chk-arrow">→</span><input type="date" data-chk="dateEnd" value="${it.dateEnd||""}" title="Date de fin">` : ""}
      </div>
    </div>`;
  }).join("")}</div>`;
}
function refreshChecklistUI(){
  document.getElementById("checklist-items").outerHTML = checklistItemsHtml(modalChecklist);
}
function initTaskModalEvents(){
  const modal = document.getElementById("taskModal");
  modal.addEventListener("click", e => {
    if (e.target.closest("#checklist-add")){ modalChecklist.push({ text:"", done:false, date:"", dateEnd:"" }); refreshChecklistUI(); return; }
    const del = e.target.closest('[data-chk="del"]');
    if (del){ modalChecklist.splice(Number(del.closest(".checklist-item").dataset.idx), 1); refreshChecklistUI(); return; }

    const toggle = e.target.closest("[data-cbdd-toggle]");
    if (toggle){
      const panel = document.getElementById(toggle.dataset.cbddToggle+"-panel");
      modal.querySelectorAll(".cbdd-panel").forEach(p => { if (p !== panel) p.classList.add("hidden"); });
      panel.classList.toggle("hidden");
      return;
    }
    const addPerson = e.target.closest("[data-add-person]");
    if (addPerson){
      const ddId = addPerson.dataset.addPerson;
      const input = document.getElementById(ddId+"-new");
      const name = input.value.trim();
      if (!name) return;
      const arr = modalMultiSelects[ddId];
      if (!arr.includes(name)) arr.push(name);
      const panel = document.getElementById(ddId+"-panel");
      const existingBox = [...panel.querySelectorAll("[data-cbdd-check]")].find(cb => cb.value === name);
      if (existingBox) existingBox.checked = true;
      else {
        panel.querySelector(".cbdd-list").insertAdjacentHTML("beforeend",
          `<label class="cbdd-item"><input type="checkbox" data-cbdd-check="${ddId}" value="${escapeHtml(name)}" checked><span>${escapeHtml(name)}</span></label>`);
      }
      updateCbddTrigger(ddId);
      input.value = "";
      return;
    }
    if (!e.target.closest(".cbdd")) modal.querySelectorAll(".cbdd-panel").forEach(p => p.classList.add("hidden"));
  });
  modal.addEventListener("input", e => {
    const txt = e.target.closest('[data-chk="text"]');
    if (txt) modalChecklist[Number(txt.closest(".checklist-item").dataset.idx)].text = txt.value;
  });
  modal.addEventListener("change", e => {
    const chk = e.target.closest('[data-chk="done"]');
    if (chk) modalChecklist[Number(chk.closest(".checklist-item").dataset.idx)].done = chk.checked;
    const dt = e.target.closest('[data-chk="date"]');
    if (dt) modalChecklist[Number(dt.closest(".checklist-item").dataset.idx)].date = dt.value;
    const dtEnd = e.target.closest('[data-chk="dateEnd"]');
    if (dtEnd) modalChecklist[Number(dtEnd.closest(".checklist-item").dataset.idx)].dateEnd = dtEnd.value;
    const periodToggle = e.target.closest('[data-chk="period-toggle"]');
    if (periodToggle){
      const idx = Number(periodToggle.closest(".checklist-item").dataset.idx);
      modalChecklist[idx].dateEnd = periodToggle.checked ? (modalChecklist[idx].date || "") : "";
      refreshChecklistUI();
      return;
    }

    const cb = e.target.closest("[data-cbdd-check]");
    if (cb){
      const ddId = cb.dataset.cbddCheck, val = cb.value, arr = modalMultiSelects[ddId];
      if (cb.checked){ if (!arr.includes(val)) arr.push(val); }
      else { const i = arr.indexOf(val); if (i>-1) arr.splice(i,1); }
      updateCbddTrigger(ddId);
    }
  });
}
function updateCbddTrigger(ddId){
  const arr = modalMultiSelects[ddId] || [];
  const trigger = document.querySelector(`[data-cbdd-toggle="${ddId}"] .cbdd-trigger-text`);
  if (trigger) trigger.textContent = arr.length ? arr.join(", ") : "Sélectionner…";
}

// Suppression via l'icône ✕ sur la carte, en deux clics (sans window.confirm — souvent
// bloqué dans l'iframe d'un widget Grist, ce qui rendait le bouton "Supprimer" muet).
// Confirmation en deux clics sans window.confirm (souvent bloqué dans l'iframe d'un
// widget Grist). Premier clic : le bouton affiche confirmLabel quelques secondes ;
// second clic dans ce délai : exécute l'action. État stocké sur le bouton lui-même,
// donc ça fonctionne même si le bouton est reconstruit entre-temps par un re-rendu.
function armDoubleClickConfirm(btn, actionFn, confirmLabel, resetMs=3000){
  if (btn.dataset.armed === "1"){
    btn.dataset.armed = "0";
    clearTimeout(Number(btn.dataset.timerId));
    btn.textContent = btn.dataset.originalLabel;
    actionFn();
  } else {
    if (!btn.dataset.originalLabel) btn.dataset.originalLabel = btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = confirmLabel;
    btn.dataset.timerId = String(setTimeout(() => { btn.dataset.armed = "0"; btn.textContent = btn.dataset.originalLabel; }, resetMs));
  }
}

async function confirmDeleteTask(id){
  const t = state.records.find(r => r.id === id);
  const snapshot = { ...t };
  await writeToGrist(() => deleteTask(id), "Suppression non enregistrée dans Grist.");
  state.records = state.records.filter(r => r.id !== id);
  if (state.editingId === id) closeTaskModal();
  notify();
  showToast("🗑️ Tâche supprimée.");
  pushUndo(async () => {
    const { id: _oldId, ...fields } = snapshot;
    const tempId = -Date.now();
    state.records.push({ id: tempId, ...fields });
    notify();
    const result = await writeToGrist(() => createTask(fields), "Restauration non enregistrée dans Grist.");
    const realId = result?.id ?? (Array.isArray(result) ? result[0]?.id : undefined);
    if (realId){ const rec = state.records.find(r => r.id === tempId); if (rec) rec.id = realId; }
    showToast("↩️ Tâche restaurée (nouvel identifiant, l'historique n'est pas repris).");
  });
}

function duplicateTaskModal(id){
  const t = state.records.find(r => r.id === id);
  if (!t) return;
  const { id: _old, CreeLe, DerniereMaj, Historique, ...rest } = t;
  handleAddCard(state.columnsConfig.find(l => l.statut === t.Statut)?.id || state.columnsConfig[0].id, { ...rest, Description: (t.Description||"") + " (copie)" });
  closeTaskModal();
}

function saveAsTemplate(id){
  const t = state.records.find(r => r.id === id);
  const btn = document.getElementById("m-save-template");
  if (!t || !btn || btn.dataset.editing === "1") return;
  btn.dataset.editing = "1";
  const wrapper = document.createElement("span");
  wrapper.style.cssText = "display:inline-flex;gap:4px;align-items:center;";
  wrapper.innerHTML = `<input type="text" id="tpl-name-input" value="${escapeHtml(t.Description||"Modèle")}" style="width:120px;padding:5px 7px;border:1px solid #ccc;border-radius:6px;font-size:12px;"><button type="button" class="icon-btn" id="tpl-name-ok" title="Valider">✔️</button>`;
  btn.replaceWith(wrapper);
  const input = wrapper.querySelector("#tpl-name-input");
  input.focus(); input.select();
  const finish = save => {
    const name = input.value.trim();
    wrapper.replaceWith(btn);
    btn.dataset.editing = "0";
    if (!save || !name) return;
    const tpl = { id: cid(), name, Description: t.Description, Priorite: t.Priorite, Type: t.Type, Notes: t.Notes, Checklist: t.Checklist };
    const list = [...(state.taskTemplates || []), tpl];
    setTaskTemplates(list);
    saveTemplates(list);
    showToast(`Modèle "${name}" enregistré.`);
  };
  wrapper.querySelector("#tpl-name-ok").onclick = () => finish(true);
  input.addEventListener("keydown", e => { if (e.key==="Enter") finish(true); if (e.key==="Escape") finish(false); });
  input.addEventListener("blur", () => setTimeout(() => { if (btn.dataset.editing === "1") finish(false); }, 150));
}

async function saveTaskModal(){
  const id = state.editingId, t = state.records.find(r => r.id === id);
  const val = sel => document.getElementById(sel).value.trim();
  const newStatut = document.getElementById("m-statut").value;
  const laneForNewStatut = state.columnsConfig.find(l => l.statut === newStatut);
  const wasDifferentStatut = t && t.Statut !== newStatut;
  const historique = wasDifferentStatut
    ? (t.Historique ? t.Historique+"\n" : "") + `${fmtDateTime(new Date())} : ${t.Statut || "—"} → ${newStatut}`
    : (t.Historique || "");

  const fields = {
    Description: val("m-desc"), Priorite: document.getElementById("m-priorite").value, Statut: newStatut,
    Deadline: jsDateToGristEpoch(document.getElementById("m-deadline").value),
    DateDebut: jsDateToGristEpoch(document.getElementById("m-datedebut").value),
    Type: document.getElementById("m-type").value, Recurrence: document.getElementById("m-recurrence").value,
    AssigneA: encodeChoiceList(modalMultiSelects["m-assigne"] || []),
    Responsable: encodeChoiceList(modalMultiSelects["m-resp"] || []),
    Notes: val("m-notes"),
    Checklist: JSON.stringify(modalChecklist.filter(it => it.text.trim() !== "")),
    Couleur: modalColorAuto ? "" : document.getElementById("m-couleur").value,
    JalonCle: document.getElementById("m-jalon").checked,
    Historique: historique,
  };
  await writeToGrist(() => updateTaskFields(id, fields), "Modifications non enregistrées dans Grist.");
  patchRecordLocally(id, fields);
  closeTaskModal();
  notify();
  if (wasDifferentStatut){
    launchEffect(laneForNewStatut, innerWidth/2, innerHeight/2);
    maybeSpawnRecurrence(state.records.find(r => r.id === id), laneForNewStatut?.dashCategory);
  }
}

/* ===== ONGLET PORTEFEUILLE PROJETS : frise glissante 12 mois + Kanban fusionné =====
   Adapté d'un widget fourni par l'utilisateur. Mapping vers notre modèle :
   Projet = Type, Tâche = Description, Début = DateDebut (ou Créé le à défaut),
   Échéance = Deadline, "terminé" = lane.dashCategory==="done" (pas de pondération). */
let pfOffset = 0;             // décalage de la fenêtre de 12 mois, en mois
let pfFilter = new Set();     // projets sélectionnés (filtre du kanban fusionné)

const fmtDateShort = d => d.toLocaleDateString("fr-FR", { day:"numeric", month:"short" });

function pfWindowStart(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth()-2+pfOffset, 1);
}
function pfPos(d, base){
  const m = (d.getFullYear()-base.getFullYear())*12 + d.getMonth()-base.getMonth();
  const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return (m + (d.getDate()-1+d.getHours()/24)/dim)/12;
}
function pfHealth(p){
  if (p.pct >= 1) return { cls:"ok", label:"Terminé" };
  if (!p.start || !p.end || p.end <= p.start) return { cls:"", label:"Sans dates" };
  const now = Date.now();
  if (now < p.start.getTime()) return { cls:"", label:"Démarre le "+fmtDateShort(p.start) };
  if (now > p.end.getTime()) return { cls:"late", label:"Échéance dépassée" };
  const reached = p.start.getTime() + p.pct*(p.end.getTime()-p.start.getTime());
  const lag = Math.round((now-reached)/86400000);
  if (lag > 7) return { cls:"late", label:"Retard ~"+(lag<21 ? lag+" j" : Math.round(lag/7)+" sem.") };
  if (lag < -7) return { cls:"ok", label:"En avance" };
  return { cls:"ok", label:"Dans les temps" };
}
function pfBuildProjects(){
  const laneByStatut = {};
  (state.columnsConfig||[]).forEach(l => laneByStatut[l.statut] = l);
  const map = new Map();
  filteredRecords().forEach(r => {
    const name = r.Type || "Sans type";
    if (!map.has(name)) map.set(name, { name, tasks:[], total:0, done:0, start:null, end:null });
    const p = map.get(name);
    const isDone = laneByStatut[r.Statut]?.dashCategory === "done";
    const start = gristDateToJS(r.DateDebut) || gristDateToJS(r.CreeLe);
    const end = gristDateToJS(r.Deadline);
    p.tasks.push({ r, start, end, done:isDone });
    p.total++;
    if (isDone) p.done++;
    [start,end].forEach(d => { if (!d) return; if (!p.start||d<p.start) p.start=d; if (!p.end||d>p.end) p.end=d; });
  });
  const projects = [...map.values()].sort((a,b) => a.name.localeCompare(b.name,"fr"));
  projects.forEach((p,i) => {
    p.color = GROUP_PALETTE[i % GROUP_PALETTE.length];
    p.pct = p.total ? p.done/p.total : 0;
    p.health = pfHealth(p);
  });
  return projects;
}
function pfRenderTimeline(projects, base){
  const tp = pfPos(new Date(), base);
  const showToday = tp>=0 && tp<=1;
  let months = "";
  for (let i=0;i<12;i++){
    const d = new Date(base.getFullYear(), base.getMonth()+i, 1);
    const isYear = i===0 || d.getMonth()===0;
    months += `<div class="${isYear?"year":""}">${d.toLocaleDateString("fr-FR",{month:"short"})}${isYear?" "+d.getFullYear():""}</div>`;
  }
  let html = `<div class="pf-timeline"><div class="pf-head">
    <div class="pf-head-lbl">Projet</div>
    <div class="pf-months-wrap"><div class="pf-months">${months}</div>
    ${showToday ? `<span class="pf-today-tag" style="left:${tp*100}%">Aujourd'hui</span>` : ""}</div>
  </div>`;
  projects.forEach(p => {
    let bar = `<span class="pf-nodates">Ajoutez des dates de début ou d'échéance</span>`;
    if (p.start && p.end){
      const ps = pfPos(p.start, base), pe = pfPos(p.end, base);
      const l = Math.max(0,ps), r = Math.min(1,pe);
      if (r > l){
        const pf = ps + p.pct*(pe-ps);
        const fillW = Math.max(0, Math.min(1, (pf-l)/(r-l)));
        bar = `<div class="pf-bar ${ps<0?"cut-l":""} ${pe>1?"cut-r":""}" style="left:${l*100}%;width:${Math.max((r-l)*100,0.6)}%;--c:${p.color};" title="${escapeHtml(p.name)} : ${fmtDateShort(p.start)} → ${fmtDateShort(p.end)}, ${Math.round(p.pct*100)}%">
          <div class="pf-fill" style="width:${fillW*100}%"></div></div>`;
      } else {
        bar = `<span class="pf-nodates">${pe<=0?"Terminé avant cette période":"Commence après cette période"}</span>`;
      }
    }
    const dim = pfFilter.size && !pfFilter.has(p.name) ? "dim" : "";
    html += `<div class="pf-row ${dim}" tabindex="0" data-pf-proj="${escapeHtml(p.name)}">
      <div class="pf-lbl">
        <div class="pf-lbl-name"><span class="pf-dot" style="background:${p.color}"></span><span>${escapeHtml(p.name)}</span></div>
        <div class="pf-pct">${Math.round(p.pct*100)}%</div>
        <div class="pf-sub">${p.done}/${p.total} tâches · <span class="${p.health.cls}">${escapeHtml(p.health.label)}</span></div>
      </div>
      <div class="pf-track">${bar}${showToday?`<div class="pf-today" style="left:${tp*100}%"></div>`:""}</div>
    </div>`;
    if (pfFilter.has(p.name)){
      const tasksSorted = [...p.tasks].sort((a,b) => (a.start?.getTime()??Infinity) - (b.start?.getTime()??Infinity));
      html += tasksSorted.map(t => pfRenderTaskRow(t, p, base)).join("");
    }
  });
  return html + `</div>`;
}
function pfRenderTaskRow(task, project, base){
  const r = task.r;
  const color = r.Couleur || project.color;
  let bar = `<span class="pf-nodates">Sans dates</span>`;
  if (task.start && task.end && task.end > task.start){
    const ps = pfPos(task.start, base), pe = pfPos(task.end, base);
    const l = Math.max(0,ps), rr = Math.min(1,pe);
    if (rr > l){
      bar = `<div class="pf-bar pf-bar-task ${ps<0?"cut-l":""} ${pe>1?"cut-r":""}" style="left:${l*100}%;width:${Math.max((rr-l)*100,0.6)}%;--c:${color};" title="${escapeHtml(r.Description||"")} : ${fmtDateShort(task.start)} → ${fmtDateShort(task.end)}"></div>`;
    } else {
      bar = `<span class="pf-nodates">${pe<=0?"Terminée avant cette période":"Commence après cette période"}</span>`;
    }
  } else if (task.start || task.end){
    const d = task.start || task.end;
    const pfr = pfPos(d, base);
    if (pfr>=0 && pfr<=1) bar = `<div class="pf-single-marker" style="left:${pfr*100}%;--c:${color};" title="${escapeHtml(r.Description||"")} : ${fmtDateShort(d)}"></div>`;
  }
  const markers = parseChecklist(r.Checklist)
    .map((it, idx) => ({ it, idx }))
    .filter(x => x.it.date)
    .map(({ it, idx }) => {
      const d1 = new Date(it.date+"T00:00:00");
      const d2 = it.dateEnd ? new Date(it.dateEnd+"T00:00:00") : null;
      const refEnd = d2 || d1;
      const overdue = !it.done && refEnd < new Date();
      const doneCls = it.done?"done":"", overdueCls = overdue?"overdue":"";
      if (d2 && d2.getTime() !== d1.getTime()){
        const start = d1<d2?d1:d2, end = d1<d2?d2:d1;
        const ps = pfPos(start, base), pe = pfPos(end, base);
        const l = Math.max(0,ps), rr = Math.min(1,pe);
        if (rr <= l) return "";
        return `<div class="pf-subtask-range ${doneCls} ${overdueCls}" data-subtask-task="${r.id}" data-subtask-idx="${idx}" style="left:${l*100}%;width:${Math.max((rr-l)*100,1)}%;--c:${color};" title="${escapeHtml(it.text||"")} — ${fmtDateShort(start)} → ${fmtDateShort(end)}${it.done?" (terminée)":""}"></div>`;
      }
      const pfr = pfPos(d1, base);
      if (pfr<0 || pfr>1) return "";
      return `<div class="pf-subtask-block ${doneCls} ${overdueCls}" data-subtask-task="${r.id}" data-subtask-idx="${idx}" style="left:${pfr*100}%;--c:${color};" title="${escapeHtml(it.text||"")} — ${fmtDateShort(d1)}${it.done?" (terminée)":""}"></div>`;
    }).join("");
  return `<div class="pf-row pf-task-row" data-id="${r.id}">
    <div class="pf-lbl pf-task-lbl"><span class="pf-task-name">↳ ${escapeHtml(r.Description||"(sans titre)")}</span></div>
    <div class="pf-track pf-task-track">${bar}${markers}</div>
  </div>`;
}

function openSubtaskPopup(taskId, idx){

    </div>
    <div class="field-row">

      ${fieldRow("Date de fin", `<input type="date" id="st-date-end" value="${it.dateEnd||""}" ${isRange?"":"disabled"}>`)}
