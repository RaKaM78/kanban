async function saveSubtaskPopup(){
  if (!subtaskContext) return;
  const { taskId, idx } = subtaskContext;
  const t = state.records.find(r => r.id === taskId);
  if (!t) return;
  const items = parseChecklist(t.Checklist);
  if (!items[idx]) return;
  const isPeriod = document.getElementById("st-period").checked;
  items[idx] = {
    ...items[idx],
    text: document.getElementById("st-text").value.trim(),
    date: document.getElementById("st-date").value,
    dateEnd: isPeriod ? document.getElementById("st-date-end").value : "",
    done: document.getElementById("st-done").checked,
  };
  const newChecklist = JSON.stringify(items);
  await writeToGrist(() => updateTaskFields(taskId, { Checklist: newChecklist }), "Sous-tâche non enregistrée dans Grist.");
  patchRecordLocally(taskId, { Checklist: newChecklist });
  closeOverlay("subtaskOverlay");
  notify();
}
function pfSubtasksHtml(raw){
  const items = parseChecklist(raw);
  if (!items.length) return "";
  const now = new Date();
  return `<div class="pf-subtasks">${items.map(it => {
    const d = it.date ? new Date(it.date+"T00:00:00") : null;
    const dEnd = it.dateEnd ? new Date(it.dateEnd+"T00:00:00") : null;
    const refDate = dEnd || d;
    const overdue = refDate && !it.done && refDate < now;
    let label = "";
    if (d && dEnd && dEnd.getTime()!==d.getTime()) label = `${fmtDateShort(d)} → ${fmtDateShort(dEnd)}`;
    else if (d) label = fmtDateShort(d);
    return `<div class="pf-subtask${it.done?" done":""}">
      <span class="pf-subtask-check">${it.done?"✅":"▫️"}</span>
      <span class="pf-subtask-text">${escapeHtml(it.text||"")}</span>
      ${label ? `<span class="pf-subtask-date${overdue?" overdue":""}">${label}</span>` : ""}
    </div>`;
  }).join("")}</div>`;
}
function pfRenderBoard(projects){
  const colorOf = Object.fromEntries(projects.map(p => [p.name, p.color]));
  const now = new Date();
  const visible = filteredRecords().filter(r => !pfFilter.size || pfFilter.has(r.Type || "Sans type"));
  let chips = projects.map(p => `<button type="button" class="pf-chip" aria-pressed="${pfFilter.has(p.name)}" data-pf-proj="${escapeHtml(p.name)}" style="--c:${p.color}"><span class="pf-dot" style="background:${p.color}"></span>${escapeHtml(p.name)}</button>`).join("");
  if (pfFilter.size) chips += `<button type="button" class="pf-chip clear" id="pfClearFilter">Tout afficher</button>`;

  const lanes = state.columnsConfig || [];
  let cols = lanes.map(lane => {
    const cards = visible.filter(r => r.Statut === lane.statut)
      .sort((a,b) => (gristDateToJS(a.Deadline)?.getTime() ?? Infinity) - (gristDateToJS(b.Deadline)?.getTime() ?? Infinity));
    const cardsHtml = cards.map(r => {
      const proj = r.Type || "Sans type";
      const deadline = gristDateToJS(r.Deadline);
      const overdue = deadline && deadline < now && lane.dashCategory!=="done" && lane.dashCategory!=="cancelled";
      return `<div class="pf-card" draggable="true" tabindex="0" data-id="${r.id}" style="--c:${r.Couleur || colorOf[proj] || "#999"}">
        <div class="pf-card-proj">${escapeHtml(proj)}</div>
        <div class="pf-card-title">${escapeHtml(r.Description||"Sans titre")}</div>
        <div class="pf-card-meta"><span>${escapeHtml(decodeChoiceList(r.AssigneA).join(", "))}</span><span class="${overdue?"overdue":""}">${deadline?fmtDateShort(deadline):""}</span></div>
        ${pfSubtasksHtml(r.Checklist)}
      </div>`;
    }).join("");
    return `<div class="pf-col" data-pf-status="${escapeHtml(lane.statut)}"><div class="pf-col-head"><span>${escapeHtml(lane.label)}</span><span class="n">${cards.length}</span></div>${cardsHtml}</div>`;
  }).join("");
  return `<div class="pf-chips">${chips}</div><div class="pf-board">${cols}</div>`;
}
function renderPortfolio(){
  const base = pfWindowStart();
  const last = new Date(base.getFullYear(), base.getMonth()+11, 1);
  const f = d => d.toLocaleDateString("fr-FR",{month:"short",year:"numeric"});
  document.getElementById("pfRange").textContent = `${f(base)} – ${f(last)}`;

  const main = document.getElementById("pfMain");
  if (!state.columnsConfig){ main.innerHTML = `<p style="padding:20px;color:#888;">Chargement…</p>`; document.getElementById("pfSummary").textContent = ""; return; }

  const projects = pfBuildProjects();
  [...pfFilter].forEach(n => { if (!projects.some(p => p.name===n)) pfFilter.delete(n); });

  const totalTasks = projects.reduce((s,p)=>s+p.total,0);
  const doneTasks = projects.reduce((s,p)=>s+p.done,0);
  const late = projects.filter(p => p.health.cls==="late").length;
  document.getElementById("pfSummary").textContent = totalTasks
    ? `${projects.length} projet${projects.length>1?"s":""}, ${Math.round(doneTasks/totalTasks*100)}% réalisé${late?`, ${late} en retard`:""}`
    : "";

  main.innerHTML = totalTasks ? (pfRenderTimeline(projects, base) + pfRenderBoard(projects)) : `<p style="padding:20px;color:#888;">Aucune tâche.</p>`;
}
function pfToggleProject(name){ pfFilter.has(name) ? pfFilter.delete(name) : pfFilter.add(name); renderPortfolio(); }
async function pfMoveCard(id, statut){
  const r = state.records.find(x => x.id===id);
  if (!r || r.Statut===statut) return;
  const prev = r.Statut;
  r.Statut = statut;
  renderPortfolio();
  const result = await writeToGrist(() => updateTaskFields(id, { Statut: statut }), "Déplacement non enregistré dans Grist.");
  if (result === undefined){ r.Statut = prev; renderPortfolio(); }
}
function initPortfolio(){
  document.getElementById("pfPrev").onclick = () => { pfOffset--; renderPortfolio(); };
  document.getElementById("pfNext").onclick = () => { pfOffset++; renderPortfolio(); };
  document.getElementById("pfToday").onclick = () => { pfOffset = 0; renderPortfolio(); };

  const main = document.getElementById("pfMain");
  main.addEventListener("click", e => {
    const proj = e.target.closest("[data-pf-proj]");
    if (proj) return pfToggleProject(proj.dataset.pfProj);
    if (e.target.closest("#pfClearFilter")){ pfFilter.clear(); return renderPortfolio(); }
    const stBlock = e.target.closest(".pf-subtask-block, .pf-subtask-range");
    if (stBlock) return openSubtaskPopup(Number(stBlock.dataset.subtaskTask), Number(stBlock.dataset.subtaskIdx));
    const taskRow = e.target.closest(".pf-task-row");
    if (taskRow) return openTaskModal(Number(taskRow.dataset.id));
    const card = e.target.closest(".pf-card");
    if (card) openTaskModal(Number(card.dataset.id));
  });
  main.addEventListener("keydown", e => {
    if (e.key==="Enter"){ const row = e.target.closest("[data-pf-proj]"); if (row) pfToggleProject(row.dataset.pfProj); }
  });
  main.addEventListener("dragstart", e => {
    const card = e.target.closest(".pf-card");
    if (card){ card.classList.add("dragging"); e.dataTransfer.setData("text/plain", card.dataset.id); }
  });
  main.addEventListener("dragend", e => e.target.closest(".pf-card")?.classList.remove("dragging"));
  main.addEventListener("dragover", e => { const col = e.target.closest(".pf-col"); if (col){ e.preventDefault(); col.classList.add("over"); } });
  main.addEventListener("dragleave", e => e.target.closest(".pf-col")?.classList.remove("over"));
  main.addEventListener("drop", e => {
    const col = e.target.closest(".pf-col");
    if (!col) return;
    e.preventDefault();
    col.classList.remove("over");
    pfMoveCard(Number(e.dataTransfer.getData("text/plain")), col.dataset.pfStatus);
  });
}

/* ===== ONGLET CALENDRIER ===== */
let calYear, calMonth, calViewMode = "month", calWeekStart;
(function initCalDate(){
  const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth();
  calWeekStart = new Date(n); calWeekStart.setDate(n.getDate() - (n.getDay()+6)%7);
})();

function renderCalendar(){
  calViewMode === "week" ? renderCalendarWeek() : renderCalendarMonth();
}
// range: bornes visibles du calendrier (Date, Date). Ajoute, en plus de la vraie deadline,
// des occurrences futures "projetées" (visuelles uniquement, aucune ligne Grist créée)
// pour les tâches récurrentes, tant qu'elles tombent dans la période affichée.
function tasksByDayMap(rangeStart, rangeEnd){
  const map = {};
  filteredRecords().forEach(r => {
    const d = gristDateToJS(r.Deadline);
    if (d){
      (map[toDateInputValue(d)] = map[toDateInputValue(d)] || []).push(r);
    }
    if (d && r.Recurrence && r.Recurrence !== "none" && rangeStart && rangeEnd){
      let next = addInterval(d, r.Recurrence);
      let guard = 0;
      while (next <= rangeEnd && guard < 366){
        guard++;
        if (next >= rangeStart){
          const key = toDateInputValue(next);
          (map[key] = map[key] || []).push({ ...r, __ghost: true });
        }
        next = addInterval(next, r.Recurrence);
      }
    }
  });
  return map;
}
function renderCalTaskChip(t){
  const style = priorityStyle(t.Priorite);
  const ghostStyle = `background:transparent;border:1px dashed ${style.badge};color:${style.badge};`;
  return `<div class="cal-task${t.__ghost?" cal-task-ghost":""}" draggable="${t.__ghost?"false":"true"}" data-cal-task="${t.id}" title="${t.__ghost?"Prochaine occurrence prévue (non créée)":""}" style="${t.__ghost?ghostStyle:`background:${style.badge}`}">${t.__ghost?"🔁 ":""}${escapeHtml(t.Description||"")}</div>`;
}
function renderCalendarMonth(){
  const grid = document.getElementById("calendarGrid");
  const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  document.getElementById("calLabel").textContent = `${monthNames[calMonth]} ${calYear}`;

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const startWeekday = (firstOfMonth.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const tasksByDay = tasksByDayMap(new Date(calYear,calMonth,1), new Date(calYear,calMonth,daysInMonth));

  const cells = [];
  for (let i = startWeekday-1; i >= 0; i--) cells.push({ day: daysInPrevMonth-i, muted:true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day:d, muted:false, dateObj:new Date(calYear,calMonth,d) });
  let extra = 1;
  while (cells.length % 7 !== 0) cells.push({ day: extra++, muted:true });

  const todayKey = toDateInputValue(new Date());
  const weekdayLabels = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  grid.innerHTML = `
    <div class="cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-days">
      ${cells.map(c => {
        if (c.muted) return `<div class="cal-day muted"><span class="cal-daynum">${c.day}</span></div>`;
        const key = toDateInputValue(c.dateObj);
        const tasks = tasksByDay[key] || [];
        return `<div class="cal-day${key===todayKey?" today":""}" data-drop-date="${key}">
          <span class="cal-daynum">${c.day}</span>
          <div class="cal-day-tasks">
            ${tasks.slice(0,3).map(renderCalTaskChip).join("")}
            ${tasks.length>3 ? `<div class="cal-more">+${tasks.length-3}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}
function renderCalendarWeek(){
  const grid = document.getElementById("calendarGrid");
  const weekdayLabels = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const days = Array.from({length:7}, (_,i) => { const d = new Date(calWeekStart); d.setDate(d.getDate()+i); return d; });
  document.getElementById("calLabel").textContent = `${fmtDate(days[0])} – ${fmtDate(days[6])}`;
  const tasksByDay = tasksByDayMap(days[0], days[6]);
  const todayKey = toDateInputValue(new Date());

  grid.innerHTML = `<div class="cal-days cal-week">
    ${days.map((d,i) => {
      const key = toDateInputValue(d);
      const tasks = tasksByDay[key] || [];
      return `<div class="cal-day${key===todayKey?" today":""}" data-drop-date="${key}">
        <span class="cal-daynum">${weekdayLabels[i]} ${d.getDate()}</span>
        <div class="cal-day-tasks">
          ${tasks.map(renderCalTaskChip).join("")}
        </div>
      </div>`;
    }).join("")}
  </div>`;
}
function initCalendar(){
  document.getElementById("calPrev").onclick = () => {
    if (calViewMode === "month"){ calMonth--; if (calMonth<0){ calMonth=11; calYear--; } }
    else { calWeekStart.setDate(calWeekStart.getDate()-7); }
    renderCalendar();
  };
  document.getElementById("calNext").onclick = () => {
    if (calViewMode === "month"){ calMonth++; if (calMonth>11){ calMonth=0; calYear++; } }
    else { calWeekStart.setDate(calWeekStart.getDate()+7); }
    renderCalendar();
  };
  document.getElementById("calToday").onclick = () => {
    const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth();
    calWeekStart = new Date(n); calWeekStart.setDate(n.getDate() - (n.getDay()+6)%7);
    renderCalendar();
  };
  document.getElementById("calViewToggle").onclick = () => {
    calViewMode = calViewMode === "month" ? "week" : "month";
    document.getElementById("calViewToggle").textContent = calViewMode === "month" ? "Vue : Mois" : "Vue : Semaine";
    renderCalendar();
  };
  const grid = document.getElementById("calendarGrid");
  grid.addEventListener("click", e => {
    const t = e.target.closest("[data-cal-task]");
    if (t) openTaskModal(Number(t.dataset.calTask));
  });
  grid.addEventListener("dragstart", e => {
    const t = e.target.closest("[data-cal-task]");
    if (t) e.dataTransfer.setData("text/plain", t.dataset.calTask);
  });
  grid.addEventListener("dragover", e => {
    const day = e.target.closest("[data-drop-date]");
    if (day){ e.preventDefault(); day.classList.add("drag-over"); }
  });
  grid.addEventListener("dragleave", e => e.target.closest("[data-drop-date]")?.classList.remove("drag-over"));
  grid.addEventListener("drop", e => {
    const day = e.target.closest("[data-drop-date]");
    if (!day) return;
    e.preventDefault();
    day.classList.remove("drag-over");
    const id = Number(e.dataTransfer.getData("text/plain"));
    const epoch = jsDateToGristEpoch(day.dataset.dropDate);
    writeToGrist(() => updateTaskFields(id, { Deadline: epoch }), "Deadline non enregistrée dans Grist.");
    patchRecordLocally(id, { Deadline: epoch });
    notify();
  });
}

/* ===== ONGLET WHITEBOARD ===== */
let wbStrokes = [];
let wbElements = [];
let wbCurrentStroke = null;
let wbDraftStart = null;
let wbActiveEl = null;
let wbSelectedId = null;
let wbColor = "#222222";
let wbSize = 3;
let wbTool = "pen"; // pen | eraser | rect | ellipse | arrow | text | sticky | select
let wbZoom = 1;
let wbSaveTimer = null;

function wbRedraw(){
  const canvas = document.getElementById("wbCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  wbStrokes.forEach(s => {
    if (s.points.length < 2) return;
    ctx.strokeStyle = s.erase ? "#ffffff" : s.color;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    s.points.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
    ctx.stroke();
  });
}
function wbResizeCanvas(){
  const wrap = document.getElementById("wbCanvasWrap");
  const rect = wrap.getBoundingClientRect();
  const w = Math.max(Math.round(rect.width*1.6), 1200), h = Math.max(Math.round(rect.height*1.6), 800);
  const canvas = document.getElementById("wbCanvas");
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  document.getElementById("wbZoomLayer").style.width = w+"px";
  document.getElementById("wbZoomLayer").style.height = h+"px";
  document.getElementById("wbOverlay").style.width = w+"px";
  document.getElementById("wbOverlay").style.height = h+"px";
  wbRedraw();
}
function wbApplyZoom(){
  document.getElementById("wbZoomLayer").style.zoom = wbZoom;
  document.getElementById("wbZoomLabel").textContent = Math.round(wbZoom*100)+"%";
}
function wbSaveDebounced(){
  clearTimeout(wbSaveTimer);
  wbSaveTimer = setTimeout(() => saveWhiteboardData({ strokes: wbStrokes, elements: wbElements }), 800);
}
function loadWhiteboardData(raw){
  const data = raw || whiteboardStore.load() || { strokes: [], elements: [] };
  if (Array.isArray(data)){ wbStrokes = data; wbElements = []; }
  else { wbStrokes = data.strokes || []; wbElements = data.elements || []; }
  if (document.getElementById("wbCanvas").width){ wbRedraw(); renderWbOverlay(); }
}
function updateWbToolbarUI(){
  document.querySelectorAll("[data-wb-tool]").forEach(b => b.classList.toggle("active", b.dataset.wbTool === wbTool));
  document.querySelectorAll("[data-wb-color]").forEach(b => b.classList.toggle("active", b.dataset.wbColor === wbColor));
}

function wbCreateElement(type, x, y){
  const defaults = { rect:{w:140,h:90}, ellipse:{w:140,h:90}, text:{w:170,h:50}, sticky:{w:160,h:140} };
  const d = defaults[type] || { w:120, h:80 };
  return { id: cid(), type, x, y, w:d.w, h:d.h, color: type==="sticky" ? "#fff6b8" : wbColor, text:"" };
}
function wbHandlesHtml(){
  return `<span class="wb-del" data-wb-del title="Supprimer">✕</span><span class="wb-resize" data-wb-resize title="Redimensionner"></span>`;
}
function wbElementHtml(el){
  if (el.type === "arrow"){
    const minX = Math.min(el.x1,el.x2), minY = Math.min(el.y1,el.y2);
    const w = Math.abs(el.x2-el.x1)||2, h = Math.abs(el.y2-el.y1)||2;
    const rx1 = el.x1-minX, ry1 = el.y1-minY, rx2 = el.x2-minX, ry2 = el.y2-minY;
    return `<div class="wb-el" data-id="${el.id}" data-type="arrow" style="left:${minX}px;top:${minY}px;width:${w}px;height:${h}px;">
      <svg width="100%" height="100%" style="position:absolute;inset:0;overflow:visible;pointer-events:none;">
        <defs><marker id="ah-${el.id}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${el.color}"/></marker></defs>
        <line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="${el.color}" stroke-width="3" marker-end="url(#ah-${el.id})"/>
      </svg>
      ${wbHandlesHtml()}
    </div>`;
  }
  const style = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
  if (el.type === "rect")
    return `<div class="wb-el" data-id="${el.id}" data-type="rect" style="${style}"><div class="wb-shape-inner" style="border:3px solid ${el.color};border-radius:6px;"></div>${wbHandlesHtml()}</div>`;
  if (el.type === "ellipse")
    return `<div class="wb-el" data-id="${el.id}" data-type="ellipse" style="${style}"><div class="wb-shape-inner" style="border:3px solid ${el.color};border-radius:50%;"></div>${wbHandlesHtml()}</div>`;
  if (el.type === "text")
    return `<div class="wb-el" data-id="${el.id}" data-type="text" style="${style}">
      <div class="wb-draghandle" data-wb-drag>⠿</div>
      <div class="wb-content" contenteditable="true" style="color:${el.color};">${escapeHtml(el.text)}</div>
      ${wbHandlesHtml()}
    </div>`;
  if (el.type === "sticky")
    return `<div class="wb-el" data-id="${el.id}" data-type="sticky" style="${style}">
      <div class="wb-draghandle" data-wb-drag>⠿</div>
      <div class="wb-content wb-sticky-content" contenteditable="true" style="background:${el.color};">${escapeHtml(el.text)}</div>
      ${wbHandlesHtml()}
    </div>`;
  return "";
}
function renderWbOverlay(){
  document.getElementById("wbOverlay").innerHTML = wbElements.map(wbElementHtml).join("");
  if (wbSelectedId) wbSelectElement(wbSelectedId);
}
function wbSelectElement(id){
  wbSelectedId = id;
  document.querySelectorAll(".wb-el").forEach(d => d.classList.toggle("selected", d.dataset.id === id));
}
function wbRecolorSelected(color){
  const el = wbElements.find(x => x.id === wbSelectedId);
  if (!el) return;
  el.color = color;
  renderWbOverlay();
  wbSaveDebounced();
}
function wbDuplicateSelected(){
  const el = wbElements.find(x => x.id === wbSelectedId);
  if (!el) return;
  const copy = { ...el, id: cid() };
  if (copy.type === "arrow"){ copy.x1 += 20; copy.y1 += 20; copy.x2 += 20; copy.y2 += 20; }
  else { copy.x += 20; copy.y += 20; }
  wbElements.push(copy);
  renderWbOverlay();
  wbSelectElement(copy.id);
  wbSaveDebounced();
}

function wbContentXY(e, wrap){
  const rect = wrap.getBoundingClientRect();
  return { x: (e.clientX-rect.left)/wbZoom + wrap.scrollLeft/wbZoom, y: (e.clientY-rect.top)/wbZoom + wrap.scrollTop/wbZoom };
}
function wbWrapPointerDown(e){
  const wrap = document.getElementById("wbCanvasWrap");
  wrap.setPointerCapture?.(e.pointerId);
  const { x, y } = wbContentXY(e, wrap);

  if (wbTool === "pen" || wbTool === "eraser"){
    wbCurrentStroke = { color: wbColor, size: wbSize, erase: wbTool === "eraser", points: [[x,y]] };
    wbStrokes.push(wbCurrentStroke);
    return;
  }
  if (wbTool === "rect" || wbTool === "ellipse"){
    wbDraftStart = { x, y, type: wbTool };
    const draft = document.createElement("div");
    draft.id = "wbDraft";
    draft.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:0;height:0;border:2px dashed ${wbColor};border-radius:${wbTool==="ellipse"?"50%":"6px"};pointer-events:none;`;
    document.getElementById("wbOverlay").appendChild(draft);
    return;
  }
  if (wbTool === "arrow"){
    wbDraftStart = { x, y, type: "arrow" };
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.id = "wbDraft";
    svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;";
    svg.innerHTML = `<line x1="${x}" y1="${y}" x2="${x}" y2="${y}" stroke="${wbColor}" stroke-width="3" stroke-dasharray="4 3"/>`;
    document.getElementById("wbOverlay").appendChild(svg);
    return;
  }
  if (wbTool === "text" || wbTool === "sticky"){
    const el = wbCreateElement(wbTool, x, y);
    wbElements.push(el);
    renderWbOverlay();
    wbSelectElement(el.id);
    wbTool = "select"; updateWbToolbarUI();
    requestAnimationFrame(() => document.querySelector(`.wb-el[data-id="${el.id}"] .wb-content`)?.focus());
    wbSaveDebounced();
    return;
  }
  wbSelectElement(null);
}
function wbWrapPointerMove(e){
  const wrap = document.getElementById("wbCanvasWrap");
  const { x, y } = wbContentXY(e, wrap);
  if (wbCurrentStroke){ wbCurrentStroke.points.push([x,y]); wbRedraw(); return; }
  if (wbDraftStart?.type === "arrow"){
    const svg = document.getElementById("wbDraft");
    if (svg){ const line = svg.querySelector("line"); line.setAttribute("x2", x); line.setAttribute("y2", y); }
    return;
  }
  if (wbDraftStart){
    const draft = document.getElementById("wbDraft");
    if (!draft) return;
    Object.assign(draft.style, {
      left: Math.min(x, wbDraftStart.x)+"px", top: Math.min(y, wbDraftStart.y)+"px",
      width: Math.abs(x-wbDraftStart.x)+"px", height: Math.abs(y-wbDraftStart.y)+"px",
    });
  }
}
function wbWrapPointerUp(e){
  if (wbCurrentStroke){ wbCurrentStroke = null; wbSaveDebounced(); return; }
  if (wbDraftStart?.type === "arrow"){
    const wrap = document.getElementById("wbCanvasWrap");
    const { x, y } = wbContentXY(e, wrap);
    document.getElementById("wbDraft")?.remove();
    if (Math.hypot(x-wbDraftStart.x, y-wbDraftStart.y) > 10){
      const el = { id: cid(), type:"arrow", x1: wbDraftStart.x, y1: wbDraftStart.y, x2: x, y2: y, color: wbColor };
      wbElements.push(el);
      renderWbOverlay();
      wbSelectElement(el.id);
      wbSaveDebounced();
    }
    wbDraftStart = null;
    wbTool = "select"; updateWbToolbarUI();
    return;
  }
  if (wbDraftStart){
    const draft = document.getElementById("wbDraft");
    const w = parseFloat(draft.style.width) || 0, h = parseFloat(draft.style.height) || 0;
    if (w > 10 && h > 10){
      const el = wbCreateElement(wbDraftStart.type, parseFloat(draft.style.left), parseFloat(draft.style.top));
      el.w = w; el.h = h;
      wbElements.push(el);
      renderWbOverlay();
      wbSelectElement(el.id);
      wbSaveDebounced();
    }
    draft.remove();
    wbDraftStart = null;
    wbTool = "select"; updateWbToolbarUI();
  }
}

function initWbOverlayEvents(){
  const overlay = document.getElementById("wbOverlay");
  overlay.addEventListener("pointerdown", e => {
    const elDiv = e.target.closest(".wb-el");
    if (!elDiv) return;
    e.stopPropagation();

    const delBtn = e.target.closest("[data-wb-del]");
    if (delBtn){
      wbElements = wbElements.filter(x => x.id !== elDiv.dataset.id);
      if (wbSelectedId === elDiv.dataset.id) wbSelectedId = null;
      renderWbOverlay();
      wbSaveDebounced();
      return;
    }

    wbSelectElement(elDiv.dataset.id);

    const resizeHandle = e.target.closest("[data-wb-resize]");
    const dragHandle = e.target.closest("[data-wb-drag]");
    const type = elDiv.dataset.type;
    const isShapeBody = (type === "rect" || type === "ellipse" || type === "arrow") && !resizeHandle;

    if (resizeHandle || dragHandle || isShapeBody){
      e.preventDefault();
      const el = wbElements.find(x => x.id === elDiv.dataset.id);
      wbActiveEl = {
        id: el.id, mode: resizeHandle ? "resize" : "move",
        startX: e.clientX, startY: e.clientY,
        orig: el.type === "arrow" ? { x1:el.x1, y1:el.y1, x2:el.x2, y2:el.y2 } : { x:el.x, y:el.y, w:el.w, h:el.h },
      };
      overlay.setPointerCapture(e.pointerId);
    }
  });
  overlay.addEventListener("pointermove", e => {
    if (!wbActiveEl) return;
    const el = wbElements.find(x => x.id === wbActiveEl.id);
    const div = overlay.querySelector(`.wb-el[data-id="${wbActiveEl.id}"]`);
    if (!el || !div) return;
    const dx = (e.clientX - wbActiveEl.startX)/wbZoom, dy = (e.clientY - wbActiveEl.startY)/wbZoom;
    if (el.type === "arrow"){
      if (wbActiveEl.mode === "move"){
        el.x1 = wbActiveEl.orig.x1+dx; el.y1 = wbActiveEl.orig.y1+dy;
        el.x2 = wbActiveEl.orig.x2+dx; el.y2 = wbActiveEl.orig.y2+dy;
      } else {
        el.x2 = wbActiveEl.orig.x2+dx; el.y2 = wbActiveEl.orig.y2+dy;
      }
      div.outerHTML = wbElementHtml(el);
      wbSelectElement(el.id);
      return;
    }
    if (wbActiveEl.mode === "move"){
      el.x = wbActiveEl.orig.x + dx; el.y = wbActiveEl.orig.y + dy;
      div.style.left = el.x + "px"; div.style.top = el.y + "px";
    } else {
      el.w = Math.max(30, wbActiveEl.orig.w + dx); el.h = Math.max(24, wbActiveEl.orig.h + dy);
      div.style.width = el.w + "px"; div.style.height = el.h + "px";
    }
  });
  const endActive = () => { if (wbActiveEl){ wbActiveEl = null; wbSaveDebounced(); } };
  overlay.addEventListener("pointerup", endActive);
  overlay.addEventListener("pointerleave", endActive);
  overlay.addEventListener("input", e => {
    const content = e.target.closest(".wb-content");
    if (!content) return;
    const el = wbElements.find(x => x.id === content.closest(".wb-el").dataset.id);
    if (el){ el.text = content.textContent; wbSaveDebounced(); }
  });
}

function initWhiteboard(){
  const wrap = document.getElementById("wbCanvasWrap");
  window.addEventListener("resize", () => { if (currentTab === "whiteboard") wbResizeCanvas(); });
  wrap.addEventListener("pointerdown", wbWrapPointerDown);
  wrap.addEventListener("pointermove", wbWrapPointerMove);
  wrap.addEventListener("pointerup", wbWrapPointerUp);
  wrap.addEventListener("pointerleave", wbWrapPointerUp);
  initWbOverlayEvents();

  document.getElementById("wbToolbar").addEventListener("click", e => {
    const toolBtn = e.target.closest("[data-wb-tool]");
    if (toolBtn){ wbTool = toolBtn.dataset.wbTool; updateWbToolbarUI(); return; }
    const colorBtn = e.target.closest("[data-wb-color]");
    if (colorBtn){
      wbColor = colorBtn.dataset.wbColor; updateWbToolbarUI();
      if (wbSelectedId) wbRecolorSelected(wbColor);
      return;
    }
    const clearBtn = e.target.closest("#wbClear");
    if (clearBtn){
      armDoubleClickConfirm(clearBtn, () => {
        const prevStrokes = wbStrokes, prevElements = wbElements;
        wbStrokes = []; wbElements = []; wbSelectedId = null;
        wbRedraw(); renderWbOverlay(); wbSaveDebounced();
        pushUndo(() => { wbStrokes = prevStrokes; wbElements = prevElements; wbRedraw(); renderWbOverlay(); wbSaveDebounced(); });
      }, "✅ Confirmer ?");
    }
  });
  document.getElementById("wbSize").addEventListener("input", e => { wbSize = Number(e.target.value); });
  document.getElementById("wbZoomIn").onclick = () => { wbZoom = Math.min(2.5, +(wbZoom+0.2).toFixed(2)); wbApplyZoom(); };
  document.getElementById("wbZoomOut").onclick = () => { wbZoom = Math.max(0.4, +(wbZoom-0.2).toFixed(2)); wbApplyZoom(); };
  document.addEventListener("keydown", e => {
    if (currentTab !== "whiteboard" || anyOverlayOpen()) return;
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="d" && wbSelectedId && !e.target.closest("[contenteditable]")){
      e.preventDefault(); wbDuplicateSelected();
    }
  });
}

function computeDashboardStats(records){
  records = records || filteredRecords();
  const laneByStatut = {};
  (state.columnsConfig||[]).forEach(l => laneByStatut[l.statut] = l);
  const now = new Date();
  let done=0, doing=0, overdue=0;
  const byStatut={}, byPriorite={}, byPerson={};
  const doneDurations = [];
  records.forEach(r => {
    const lane = laneByStatut[r.Statut];
    const cat = lane?.dashCategory || "todo";
    if (cat === "done") done++;
    if (cat === "doing") doing++;
    const d = gristDateToJS(r.Deadline);
    if (d && d < now && cat !== "done" && cat !== "cancelled") overdue++;
    if (cat === "done"){
      const created = gristDateToJS(r.CreeLe), completed = gristDateToJS(r.DerniereMaj);
      if (created && completed) doneDurations.push((completed-created)/86400000);
    }
    const statutLabel = r.Statut || "—";
    byStatut[statutLabel] = (byStatut[statutLabel]||0)+1;
    byPriorite[r.Priorite||"—"] = (byPriorite[r.Priorite||"—"]||0)+1;
    decodeChoiceList(r.AssigneA).forEach(name => {
      byPerson[name] = byPerson[name] || { total:0, doing:0 };
      byPerson[name].total++;
      if (cat === "doing") byPerson[name].doing++;
    });
  });
  const avgProcessingDays = doneDurations.length ? doneDurations.reduce((a,b)=>a+b,0)/doneDurations.length : null;
  return { total: records.length, done, doing, overdue, byStatut, byPriorite, byPerson, laneByStatut, avgProcessingDays };
}
function computeMilestones(records){
  const year = new Date().getFullYear();
  return records
    .filter(r => r.JalonCle)
    .map(r => ({ task:r, date: gristDateToJS(r.DateDebut) || gristDateToJS(r.Deadline) }))
    .filter(m => m.date && m.date.getFullYear() === year)
    .sort((a,b) => a.date - b.date);
}
function computeAttentionInsights(records, stats){
  const insights = [];
  const now = new Date();
  const laneByStatut = stats.laneByStatut || {};
  const milestones = computeMilestones(records);
  const overdueMilestones = milestones.filter(m => {
    const cat = laneByStatut[m.task.Statut]?.dashCategory;
    return cat !== "done" && cat !== "cancelled" && m.date < now;
  });
  const soonMilestones = milestones.filter(m => {
    const cat = laneByStatut[m.task.Statut]?.dashCategory;
    return cat !== "done" && cat !== "cancelled" && m.date >= now && (m.date-now) <= 14*86400000;
  });
  if (overdueMilestones.length){
    insights.push({ type:"warn", icon:"🔴", title:"Jalon(s) en retard",
      text:`${overdueMilestones.length} jalon${overdueMilestones.length>1?"s":""} clé${overdueMilestones.length>1?"s":""} dépassé${overdueMilestones.length>1?"s":""} : ${overdueMilestones.slice(0,2).map(m=>m.task.Description||"(sans titre)").join(", ")}${overdueMilestones.length>2?"…":""}` });
  } else if (soonMilestones.length){
    insights.push({ type:"warn", icon:"🟠", title:"Jalon(s) imminent(s)",
      text:`${soonMilestones.length} jalon${soonMilestones.length>1?"s":""} clé${soonMilestones.length>1?"s":""} dans les 14 prochains jours.` });
  }
  if (stats.overdue > 0){
    insights.push({ type:"warn", icon:"⏰", title:"Tâches en retard",
      text:`${stats.overdue} tâche${stats.overdue>1?"s":""} en retard sur l'ensemble du tableau.` });
  }
  const monthsFull = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const year = now.getFullYear();
  const counts = Array(12).fill(0);
  records.forEach(r => { const d = gristDateToJS(r.Deadline); if (d && d.getFullYear()===year) counts[d.getMonth()]++; });
  const total = counts.reduce((a,b)=>a+b,0);
  const avg = total / 12;
  const peak = Math.max(...counts);
  const peakIdx = counts.indexOf(peak);
  if (peak > 0 && avg > 0 && peak > avg*1.5){
    insights.push({ type:"info", icon:"📈", title:"Charge élevée",
      text:`${peak} échéance${peak>1?"s":""} concentrée${peak>1?"s":""} en ${monthsFull[peakIdx]}, au-dessus de la moyenne (${avg.toFixed(1)}/mois).` });
  }
  if (!milestones.length){
    insights.push({ type:"info", icon:"🚩", title:"Aucun jalon défini",
      text:`Cochez « Jalon clé » sur une tâche pour la faire apparaître sur la frise ci-dessus.` });
  }
  if (!insights.some(i => i.type==="warn")){
    insights.push({ type:"ok", icon:"✅", title:"Aucun point de vigilance",
      text:`Aucun retard ni surcharge détecté pour le moment.` });
  }
  return insights.slice(0,3);
}
function computeEvolutionData(){
  const weeks = 8, now = new Date();
  const buckets = [];
  for (let i = weeks-1; i >= 0; i--){
    const end = new Date(now); end.setDate(end.getDate()-i*7);
    const start = new Date(end); start.setDate(start.getDate()-6);
    buckets.push({ start, end, created:0, completed:0, label:`${start.getDate()}/${start.getMonth()+1}` });
  }
  const laneByStatut = {};
  (state.columnsConfig||[]).forEach(l => laneByStatut[l.statut] = l);
  filteredRecords().forEach(r => {
    const created = gristDateToJS(r.CreeLe);
    const isDone = laneByStatut[r.Statut]?.dashCategory === "done";
    const completed = isDone ? gristDateToJS(r.DerniereMaj) : null;
    buckets.forEach(b => {
      if (created && created >= b.start && created <= b.end) b.created++;
      if (completed && completed >= b.start && completed <= b.end) b.completed++;
    });
  });
  return buckets;
}
function renderDonutSVG(segments, size=130, thickness=20){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size-thickness)/2, circ = 2*Math.PI*r;
  let offset = 0;
  const circles = segments.map(seg => {
    const dash = (seg.value/total)*circ;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += dash;
    return el;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="800" fill="var(--ink)">${total}</text></svg>`;
}
function renderModule(id){
  const stats = computeDashboardStats();
  if (id === "kpis"){
    return `<div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-value">${stats.total}</div><div class="kpi-label">Total</div></div>
      <div class="kpi-card"><div class="kpi-value">${stats.doing}</div><div class="kpi-label">En cours</div></div>
      <div class="kpi-card"><div class="kpi-value">${stats.done}</div><div class="kpi-label">Terminées</div></div>
      <div class="kpi-card"><div class="kpi-value" style="${stats.overdue?'color:#c0392b':''}">${stats.overdue}</div><div class="kpi-label">En retard</div></div>
      <div class="kpi-card"><div class="kpi-value">${stats.avgProcessingDays!=null ? stats.avgProcessingDays.toFixed(1) : "—"}</div><div class="kpi-label">⏱️ Jours moy.</div></div>
    </div>`;
  }
  if (id === "donutStatut"){
    const entries = Object.entries(stats.byStatut);
    if (!entries.length) return `<p style="font-size:12px;color:var(--muted);">Aucune donnée.</p>`;
    const segments = entries.map(([statut,count]) => ({ value:count, color: stats.laneByStatut[statut]?.color || "#999", label:statut }));
    return `<div class="donut-wrap">${renderDonutSVG(segments)}<div class="donut-legend">${segments.map(s=>`<div><span class="donut-legend-dot" style="background:${s.color}"></span>${escapeHtml(s.label)} (${s.value})</div>`).join("")}</div></div>`;
  }
  if (id === "barsPriorite"){
    const priorities = Object.keys(PRIORITY_COLORS).filter(k=>k!=="__default");
    const max = Math.max(1, ...priorities.map(p => stats.byPriorite[p]||0));
    return priorities.map(p => {
      const count = stats.byPriorite[p]||0, pct = Math.round(count/max*100);
      return `<div class="bar-row">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:2px;"><span>${p}</span><span>${count}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${priorityStyle(p).badge}"></div></div>
      </div>`;
    }).join("");
  }
  if (id === "teamLoad"){
    const names = Object.keys(stats.byPerson).sort((a,b)=>a.localeCompare(b,"fr"));
    if (!names.length) return `<p style="font-size:12px;color:var(--muted);">Aucune tâche assignée.</p>`;
    return `<table style="width:100%;font-size:12.5px;border-collapse:collapse;">
      <tr style="text-align:left;color:var(--muted);"><th style="padding:4px 0;">Personne</th><th>Total</th><th>En cours</th></tr>
      ${names.map(n=>`<tr><td style="padding:4px 0;">${escapeHtml(n)}</td><td>${stats.byPerson[n].total}</td><td>${stats.byPerson[n].doing}</td></tr>`).join("")}
    </table>`;
  }
  if (id === "evolution"){
    const data = computeEvolutionData();
    const max = Math.max(1, ...data.map(b=>Math.max(b.created,b.completed)));
    const w=320, h=110, pad=16;
    const stepX = (w-pad*2)/((data.length-1)||1);
    const pts = key => data.map((b,i)=>`${pad+i*stepX},${h-pad-(b[key]/max)*(h-pad*2)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:420px;">
      <polyline points="${pts('created')}" fill="none" stroke="#4f7cff" stroke-width="2"/>
      <polyline points="${pts('completed')}" fill="none" stroke="#3a9d4c" stroke-width="2"/>
    </svg>
    <div style="font-size:11px;display:flex;gap:14px;margin-top:4px;">
      <span><span style="display:inline-block;width:8px;height:8px;background:#4f7cff;border-radius:50%;margin-right:4px;"></span>Créées</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#3a9d4c;border-radius:50%;margin-right:4px;"></span>Terminées</span>
    </div>`;
  }
  if (id === "chargeParMois"){
    const year = new Date().getFullYear();
    const now = new Date();
    const monthsFull = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    const counts = Array(12).fill(0);
    filteredRecords().forEach(r => {
      const d = gristDateToJS(r.Deadline);
      if (d && d.getFullYear() === year) counts[d.getMonth()]++;
    });
    const max = Math.max(1, ...counts);
    const peakIdx = counts.indexOf(max);
    const bars = counts.map((c,i) => {
      const pct = c/max;
      let color = "#7fa8e0"; // Faible
      if (c>0 && i===peakIdx) color = "#e8a34d"; // Pic de charge
      else if (pct > 0.7) color = "#e0625f"; // Élevée
      else if (pct >= 0.4) color = "#4f7cff"; // Modérée
      const h = c ? Math.max(6, Math.round(pct*100)) : 2;
      const isCurrent = year===now.getFullYear() && i===now.getMonth();
      return `<div class="cm-bar-wrap"><div class="cm-value">${c}</div><div class="cm-bar" style="height:${h}%;background:${color};"></div><div class="cm-label${isCurrent?" current":""}">${monthsFull[i]}</div></div>`;
    }).join("");
    return `<div class="cm-chart">${bars}</div>
      <div class="cm-legend">
        <span><i style="background:#7fa8e0"></i>Faible (&lt;40%)</span>
        <span><i style="background:#4f7cff"></i>Modérée (40-70%)</span>
        <span><i style="background:#e0625f"></i>Élevée (&gt;70%)</span>
        <span><i style="background:#e8a34d"></i>Pic de charge</span>
      </div>`;
  }
  if (id === "syntheseParProjet"){
    const groups = {};
    filteredRecords().forEach(r => { (groups[r.Type||"Sans type"] = groups[r.Type||"Sans type"] || []).push(r); });
    const names = Object.keys(groups).sort((a,b) => a.localeCompare(b,"fr"));
    if (!names.length) return `<p style="font-size:12px;color:var(--muted);">Aucune tâche.</p>`;
    const monthsShort = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    const now = new Date();
    const cards = names.map((name,i) => {
      const tasks = groups[name];
      const color = GROUP_PALETTE[i % GROUP_PALETTE.length];
      const dateOf = r => gristDateToJS(r.DateDebut) || gristDateToJS(r.CreeLe) || gristDateToJS(r.Deadline);
      const allDates = tasks.flatMap(r => [dateOf(r), gristDateToJS(r.Deadline)]).filter(Boolean);
      const minD = allDates.length ? new Date(Math.min(...allDates.map(d=>d.getTime()))) : null;
      const maxD = allDates.length ? new Date(Math.max(...allDates.map(d=>d.getTime()))) : null;
      const range = minD && maxD ? `${monthsShort[minD.getMonth()]} → ${monthsShort[maxD.getMonth()]}` : "Sans dates";
      const sorted = [...tasks].sort((a,b) => (dateOf(a)?.getTime()??0) - (dateOf(b)?.getTime()??0));
      const segs = sorted.map(r => `<div class="sp-seg" style="background:${r.Couleur||color}" title="${escapeHtml(r.Description||"")}"></div>`).join("");
      const todayLine = (minD && maxD && maxD>minD) ? `<div class="sp-today" style="left:${Math.min(1,Math.max(0,(now-minD)/(maxD-minD)))*100}%"></div>` : "";
      return `<div class="sp-card" style="border-color:${color}" data-pf-proj-link="${escapeHtml(name)}" title="Voir dans le Portefeuille">
        <div class="sp-title">${escapeHtml(name)}</div>
        <div class="sp-sub">${tasks.length} tâche${tasks.length>1?"s":""} · ${range}</div>
        <div class="sp-bar">${segs}${todayLine}</div>
      </div>`;
    }).join("");
    return `<div class="sp-grid">${cards}</div>`;
  }
  if (id === "deadlines"){
    const withDeadline = filteredRecords().filter(r=>r.Deadline).sort((a,b)=>gristDateToJS(a.Deadline)-gristDateToJS(b.Deadline));
    if (!withDeadline.length) return `<p style="font-size:12px;color:var(--muted);">Aucune échéance définie.</p>`;
    const now = new Date();
    return withDeadline.map(r => {
      const d = gristDateToJS(r.Deadline), overdue = d < now;
      return `<div data-cal-task="${r.id}" style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:12.5px;cursor:pointer;">
        <span>${escapeHtml(r.Description||"(sans titre)")}</span>
        <span style="${overdue?'color:#c0392b;font-weight:700;':''}">${fmtDate(d)}</span>
      </div>`;
    }).join("");
  }
  if (id === "jalonsAttention"){
    const records = filteredRecords();
    const milestones = computeMilestones(records);
    const now = new Date();
    const year = now.getFullYear();
    const yearStart = new Date(year,0,1).getTime(), yearEnd = new Date(year,11,31,23,59,59).getTime();
    const monthsShort = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
    const markersHtml = milestones.length ? milestones.map((m,i) => {
      const pct = Math.min(100, Math.max(0, (m.date.getTime()-yearStart)/(yearEnd-yearStart)*100));
      const color = m.task.Couleur || "#4f9eff";
      const below = i%2===1;
      return `<div class="jal-marker${m.date<now?" past":""}" style="left:${pct}%;color:${color};" data-cal-task="${m.task.id}" title="${escapeHtml(m.task.Description||"")}">
        <div class="jal-tag${below?" below":""}"><span class="jal-month">${monthsShort[m.date.getMonth()]}</span><span class="jal-desc">${escapeHtml(m.task.Description||"(sans titre)")}</span></div>
      </div>`;
    }).join("") : `<div class="jal-empty">Aucun jalon clé pour ${year}. Cochez « 🚩 Jalon clé » dans la fiche d'une tâche pour l'afficher ici.</div>`;
    const stats = computeDashboardStats(records);
    const insights = computeAttentionInsights(records, stats);
    const manual = state.manualAttention || [];
    const autoCardsHtml = insights.map(ins => `
      <div class="jal-card ${ins.type}">
        <div class="jal-card-head"><span>${ins.icon}</span><span>${escapeHtml(ins.title)}</span></div>
        <div class="jal-card-body">${escapeHtml(ins.text)}</div>
      </div>`).join("");
    const manualCardsHtml = manual.map(m => `
      <div class="jal-card manual">
        <button type="button" class="jal-card-del" data-attn-del="${m.id}" title="Supprimer">✕</button>
        <div class="jal-card-head"><span>📝</span><span>Note</span></div>
        <div class="jal-card-body" contenteditable="true" data-attn-body="${m.id}">${escapeHtml(m.text||"")}</div>
      </div>`).join("");
    return `<div class="jal-wrap">
      <div class="jal-title">📅 JALONS CLÉS ${year}</div>
      <div class="jal-timeline">
        <div class="jal-axis"></div>
        ${markersHtml}
        <div class="jal-months">${monthsShort.map(m=>`<span>${m}</span>`).join("")}</div>
      </div>
      <div class="jal-title" style="margin-top:22px;">⚠️ POINTS D'ATTENTION</div>
      <div class="jal-attn-grid">
        ${autoCardsHtml}
        ${manualCardsHtml}
        <div class="jal-add-card" data-attn-add="1">➕ Ajouter une note</div>
      </div>
    </div>`;
  }
  return "";
}
function renderDashboard(){
  const grid = document.getElementById("dashboardGrid");
  if (!state.dashboardLayout){ grid.innerHTML = ""; return; }
  const visible = state.dashboardLayout.filter(m => m.visible && DASHBOARD_MODULES[m.id]);
  grid.innerHTML = visible.length ? visible.map(m => `
    <div class="dash-module${DASHBOARD_MODULES[m.id].full ? " full" : ""}">
      <h3>${escapeHtml(DASHBOARD_MODULES[m.id].label)}</h3>
      ${renderModule(m.id)}
    </div>`).join("") : `<p style="padding:20px;color:#888;">Aucun module actif — cliquez sur ⚙️ Personnaliser pour en ajouter.</p>`;
}
function initDashboard(){
  document.getElementById("dashboardGrid").addEventListener("click", e => {
    const t = e.target.closest("[data-cal-task]");
    if (t) return openTaskModal(Number(t.dataset.calTask));
    const sp = e.target.closest("[data-pf-proj-link]");
    if (sp){ pfFilter = new Set([sp.dataset.pfProjLink]); switchTab("table"); }
    const add = e.target.closest("[data-attn-add]");
    if (add){
      const item = { id:cid(), text:"Nouvelle note…" };
      const list = [...(state.manualAttention||[]), item];
      setManualAttention(list); saveManualAttention(list);
      requestAnimationFrame(() => {
        const body = document.querySelector(`[data-attn-body="${item.id}"]`);
        if (body){ body.focus(); document.execCommand("selectAll", false, null); }
      });
      return;
    }
    const del = e.target.closest("[data-attn-del]");
    if (del) return armDoubleClickConfirm(del, () => {
      const list = (state.manualAttention||[]).filter(m => m.id !== del.dataset.attnDel);
      setManualAttention(list); saveManualAttention(list);
    }, "✓", 2500);
  });
  document.getElementById("dashboardGrid").addEventListener("focusout", e => {
    const body = e.target.closest("[data-attn-body]");
    if (!body) return;
    const id = body.dataset.attnBody, text = body.textContent.trim();
    const list = (state.manualAttention||[]).map(m => m.id===id ? { ...m, text } : m);
    setManualAttention(list); saveManualAttention(list);
  });
  document.getElementById("dashboardGrid").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.closest("[data-attn-body]")){ e.preventDefault(); e.target.blur(); }
  });
  document.getElementById("btnDashExport").onclick = exportCsv;
  document.getElementById("btnDashPrint").onclick = () => window.print();
  document.getElementById("btnDashConfig").onclick = openDashConfigModal;
}

let dashWorkingCopy = [];
function openDashConfigModal(){
  dashWorkingCopy = (state.dashboardLayout || defaultDashboardLayout()).map(m => ({ ...m }));
  Object.keys(DASHBOARD_MODULES).forEach(id => { if (!dashWorkingCopy.find(m => m.id === id)) dashWorkingCopy.push({ id, visible:false }); });
  renderDashConfigModal();
  openOverlay("dashConfigOverlay");
}
function renderDashConfigModal(){
  const cfg = dashWorkingCopy;
  document.getElementById("dashConfigModal").innerHTML = `
    <h2>Personnaliser le tableau de bord</h2>
    <div id="dash-config-list">
      ${cfg.map((m,i) => `
        <div class="dash-config-row" data-idx="${i}">
          <button class="icon-btn" data-move="up" ${i===0?'disabled style="opacity:.3"':""}>↑</button>
          <button class="icon-btn" data-move="down" ${i===cfg.length-1?'disabled style="opacity:.3"':""}>↓</button>
          <label style="flex:1;display:flex;align-items:center;gap:6px;"><input type="checkbox" data-dash-visible ${m.visible?"checked":""}> ${escapeHtml(DASHBOARD_MODULES[m.id]?.label || m.id)}</label>
        </div>`).join("")}
    </div>
    <div class="modal-footer">
      <button class="btn secondary" id="dc-close">Annuler</button>
      <button class="btn" id="dc-save">Enregistrer</button>
    </div>`;
  document.getElementById("dash-config-list").addEventListener("click", e => {
    const row = e.target.closest(".dash-config-row");
    if (!row) return;
    const idx = Number(row.dataset.idx);
    if (e.target.closest("[data-move]")){
      const j = idx + (e.target.dataset.move === "up" ? -1 : 1);
      if (j >= 0 && j < cfg.length){ [cfg[idx],cfg[j]] = [cfg[j],cfg[idx]]; renderDashConfigModal(); }
    }
  });
  document.getElementById("dash-config-list").addEventListener("change", e => {
    if (e.target.matches("[data-dash-visible]")){
      cfg[Number(e.target.closest(".dash-config-row").dataset.idx)].visible = e.target.checked;
    }
  });
  document.getElementById("dc-close").onclick = () => closeOverlay("dashConfigOverlay");
  document.getElementById("dc-save").onclick = () => { setDashboardLayout(dashWorkingCopy); saveDashboardLayout(dashWorkingCopy); closeOverlay("dashConfigOverlay"); };
}

/* ===== NAVIGATION PAR ONGLETS ===== */
let currentTab = "kanban";
function renderTab(tab){
  if (tab === "kanban") renderBoard();
  else if (tab === "table") renderPortfolio();
  else if (tab === "calendar") renderCalendar();
  else if (tab === "whiteboard"){ wbResizeCanvas(); renderWbOverlay(); }
  else if (tab === "dashboard") renderDashboard();
  refreshOverdueBadge();
  renderGlobalStats();
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.getElementById("view-"+tab).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
  renderTab(tab);
}

/* ===== RACCOURCIS CLAVIER =====
   Ctrl+N est réservé par les navigateurs (nouvelle fenêtre) et n'atteint jamais la page ;
   la touche "n" seule (hors saisie de texte) sert donc de raccourci "nouvelle tâche". */
document.addEventListener("keydown", e => {
  const typing = e.target.closest("input,textarea,[contenteditable]");
  if (e.key === "Escape"){
    if (anyOverlayOpen()) closeAllOverlays();
    return;
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "z" && !typing){
    e.preventDefault(); performUndo(); return;
  }
  if (!typing && e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && currentTab === "kanban" && state.columnsConfig?.[0]){
    e.preventDefault(); getActiveLanes()[0] && handleAddCard(getActiveLanes()[0].id);
  }
});

/* ===== COMPOSITION ROOT ===== */
subscribe(() => renderTab(currentTab));
initBoardEvents();
initBulkBar();
initTaskModalEvents();
initFiltersBar();
initCalendar();
initPortfolio();
initAlerts();
initThemeToggle();
document.getElementById("btnGlobalExportCsv").onclick = exportCsv;
initWhiteboard();
initDashboard();
updateWbToolbarUI();
wbApplyZoom();
document.getElementById("tabBar").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  if (btn) switchTab(btn.dataset.tab);
});
document.getElementById("btnTemplates").onclick = openTemplatesModal;

initGrist({
  onRecordsChange: setRecords,
  onOptionsChange: options => {
    setColumnsConfig(options.kanbanColumns || columnsStore.load() || defaultColumnsConfig());
    loadWhiteboardData(options.whiteboardData);
    setDashboardLayout(options.dashboardLayout || dashboardStore.load() || defaultDashboardLayout());
    setTaskTemplates(options.taskTemplates || templatesStore.load() || defaultTaskTemplates());
    setManualAttention(options.manualAttention || attentionStore.load() || []);
  },
  onUnavailable: () => {
    setColumnsConfig(columnsStore.load() || defaultColumnsConfig());
    loadWhiteboardData(null);
    setDashboardLayout(dashboardStore.load() || defaultDashboardLayout());
    setTaskTemplates(templatesStore.load() || defaultTaskTemplates());
    setManualAttention(attentionStore.load() || []);
    setRecords([]);
  },
});

document.getElementById("btnSettings").onclick = openSettingsModal;
document.getElementById("btnNewCard").onclick = () => getActiveLanes()[0] && handleAddCard(getActiveLanes()[0].id);
document.getElementById("btnExportCsv").onclick = exportCsv;
const board = document.getElementById("board");
if (localStorage.getItem("kanban_view_mode") === "stacked") board.classList.add("stacked");
document.getElementById("btnToggleView").onclick = () => {
  const stacked = board.classList.toggle("stacked");
  localStorage.setItem("kanban_view_mode", stacked ? "stacked" : "columns");
};
</script>
